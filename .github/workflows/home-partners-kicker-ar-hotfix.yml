name: Home partners Arabic kicker hotfix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-partners-kicker-ar-hotfix.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Arabic partners kicker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<span class="dd-partners-kicker">Dear Day Partners</span>'
          new = '<span class="dd-partners-kicker">شركاء Dear Day</span>'
          if old not in s:
              raise SystemExit('Target partners kicker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change and remove temporary workflow
        run: |
          git config user.name 'Dear Day Automation'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/home-partners-kicker-ar-hotfix.yml
          git add index.html .github/workflows/home-partners-kicker-ar-hotfix.yml
          git commit -m 'Localize partners kicker on Arabic home'
          git push
