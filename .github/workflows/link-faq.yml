name: Link FAQ footer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-faq.yml'
permissions:
  contents: write
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update FAQ footer links
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = 0
          for p in Path('.').rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              new = text.replace('href="#">الأسئلة المتكررة</a>', 'href="/approved-pages/Dear-Day-FAQ.html">الأسئلة المتكررة</a>')
              new = new.replace("href='#'>الأسئلة المتكررة</a>", 'href="/approved-pages/Dear-Day-FAQ.html">الأسئلة المتكررة</a>')
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed += 1
          print(f'updated {changed} files')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'approved-pages/*.html'
          git commit -m 'Link FAQ footer across site'
          git push
