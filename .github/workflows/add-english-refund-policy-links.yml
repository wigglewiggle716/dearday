name: Wire English refund policy
on:
  push:
    paths:
      - '.github/workflows/add-english-refund-policy-links.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update refund policy links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          cart=Path('approved-pages/dear-day-cart.js')
          s=cart.read_text(encoding='utf-8')
          new_fn = "  function patchRefundPolicyLink(){\n    const english=isEnglishPage();\n    document.querySelectorAll('.footer-top>div').forEach(col=>{\n      const heading=String(col.querySelector('h4')?.textContent||'').replace(/\\s+/g,' ').trim().toLowerCase();\n      const isSupport=english ? (heading==='customer service'||heading.includes('customer service')) : heading==='خدمة العملاء';\n      if(!isSupport)return;\n      const href=english?'/approved-pages/Dear-Day-Refunds-en.html':'/approved-pages/Dear-Day-Refunds.html';\n      if(col.querySelector(`a[href=\\\"${href}\\\"]`))return;\n      const link=document.createElement('a');\n      link.href=href;\n      link.textContent=english?'Cancellation & Refund Policy':'سياسة الإلغاء والاسترداد';\n      col.appendChild(link);\n    });\n  }\n\n  function patchReviewConsent"
          pattern=r'  function patchRefundPolicyLink\(\)\{.*?\n  \}\n\n  function patchReviewConsent'
          s,n=re.subn(pattern,lambda m:new_fn,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'Expected one patchRefundPolicyLink function, found {n}')
          s=s.replace('and <a href="/approved-pages/Dear-Day-Refunds.html" target="_blank" rel="noopener">Cancellation & Refund Policy</a>', 'and <a href="/approved-pages/Dear-Day-Refunds-en.html" target="_blank" rel="noopener">Cancellation & Refund Policy</a>')
          cart.write_text(s,encoding='utf-8')
          ar=Path('approved-pages/Dear-Day-Refunds.html')
          s=ar.read_text(encoding='utf-8')
          canonical='<link rel="canonical" href="https://deardayy.vercel.app/approved-pages/Dear-Day-Refunds.html">'
          if 'hreflang="en"' not in s:
              s=s.replace(canonical, canonical+'\n<link rel="alternate" hreflang="ar" href="https://deardayy.vercel.app/approved-pages/Dear-Day-Refunds.html">\n<link rel="alternate" hreflang="en" href="https://deardayy.vercel.app/approved-pages/Dear-Day-Refunds-en.html">')
          ar.write_text(s,encoding='utf-8')
          for p in list(Path('.').glob('*.html'))+list(Path('approved-pages').glob('*.html')):
              raw=p.read_text(encoding='utf-8')
              new=re.sub(r'dear-day-cart\.js\?v=[^"\']+', 'dear-day-cart.js?v=20261003-6', raw)
              if new!=raw:
                  p.write_text(new,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add approved-pages/dear-day-cart.js approved-pages/Dear-Day-Refunds.html '*.html' approved-pages/*.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Link English cancellation and refund policy"
            git push
          fi
