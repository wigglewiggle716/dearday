name: Wire English refund policy
on:
  push:
    paths:
      - '.github/workflows/add-english-refund-policy-links.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update refund policy links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          cart=Path('approved-pages/dear-day-cart.js')
          s=cart.read_text(encoding='utf-8')
          replacement=r'''  function patchRefundPolicyLink(){
    const english=isEnglishPage();
    document.querySelectorAll('.footer-top>div').forEach(col=>{
      const heading=String(col.querySelector('h4')?.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
      const isSupport=english ? (heading==='customer service'||heading.includes('customer service')) : heading==='خدمة العملاء';
      if(!isSupport)return;
      const href=english?'/approved-pages/Dear-Day-Refunds-en.html':'/approved-pages/Dear-Day-Refunds.html';
      if(col.querySelector(`a[href="${href}"]`))return;
      const link=document.createElement('a');
      link.href=href;
      link.textContent=english?'Cancellation & Refund Policy':'سياسة الإلغاء والاسترداد';
      col.appendChild(link);
    });
  }

  function patchReviewConsent'''
          s,n=re.subn(r'  function patchRefundPolicyLink\(\)\{.*?\n  \}\n\n  function patchReviewConsent',replacement,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'Expected one patchRefundPolicyLink function, found {n}')
          s=s.replace('and <a href="/approved-pages/Dear-Day-Refunds.html" target="_blank" rel="noopener">Cancellation & Refund Policy</a>', 'and <a href="/approved-pages/Dear-Day-Refunds-en.html" target="_blank" rel="noopener">Cancellation & Refund Policy</a>')
          cart.write_text(s,encoding='utf-8')

          ar=Path('approved-pages/Dear-Day-Refunds.html')
          s=ar.read_text(encoding='utf-8')
          canonical='<link rel="canonical" href="https://deardayy.vercel.app/approved-pages/Dear-Day-Refunds.html">'
          alternates=canonical+'\n<link rel="alternate" hreflang="ar" href="https://deardayy.vercel.app/approved-pages/Dear-Day-Refunds.html">\n<link rel="alternate" hreflang="en" href="https://deardayy.vercel.app/approved-pages/Dear-Day-Refunds-en.html">'
          if 'hreflang="en"' not in s:
              s=s.replace(canonical,alternates)
          ar.write_text(s,encoding='utf-8')

          # Refresh customer runtime references so English footers pick up the new shared patch.
          for p in list(Path('.').glob('*.html'))+list(Path('approved-pages').glob('*.html')):
              raw=p.read_text(encoding='utf-8')
              new=re.sub(r'dear-day-cart\.js\?v=[^"\']+', 'dear-day-cart.js?v=20261003-6', raw)
              if new!=raw:
                  p.write_text(new,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add approved-pages/dear-day-cart.js approved-pages/Dear-Day-Refunds.html '*.html' approved-pages/*.html
          git commit -m "Link English cancellation and refund policy"
          git push
