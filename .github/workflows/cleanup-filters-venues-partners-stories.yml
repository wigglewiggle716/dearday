name: Cleanup partner hero
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-filters-venues-partners-stories.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center partner hero
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('approved-pages/Dear-Day-Partners.html')
          s=p.read_text(encoding='utf-8')
          ns=re.sub(r'\s*<aside class="hero-card">.*?</aside>','',s,count=1,flags=re.S)
          ns=ns.replace('.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:48px;align-items:center}',
                        '.hero-grid{display:block;max-width:860px;margin:0 auto;text-align:center}',1)
          ns=ns.replace('.hero p{margin:0;color:var(--muted);font-size:16px;max-width:720px}',
                        '.hero p{margin:0 auto;color:var(--muted);font-size:16px;max-width:720px}',1)
          ns=ns.replace('.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}',
                        '.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px;justify-content:center}',1)
          if ns==s:
              raise SystemExit('Partner hero cleanup made no changes')
          p.write_text(ns,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add approved-pages/Dear-Day-Partners.html
          git commit -m 'Center partner page hero and form'
          git push
