name: Fix Dear Note resize
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dear-note-resize.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable manual resize and auto-grow Dear Note
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('approved-pages/dear-day-cart.js')
          s=p.read_text(encoding='utf-8')
          old='width:100%;min-height:112px;resize:vertical;border:1px solid #e4d3cd;border-radius:16px;'
          new='width:100%;min-height:112px;resize:none;overflow:hidden;border:1px solid #e4d3cd;border-radius:16px;'
          if old not in s:
              raise SystemExit('Dear Note resize CSS marker not found')
          s=s.replace(old,new,1)
          old_js="""    input.value=String(plan.heartMessage||'').slice(0,220);\n    count.textContent=input.value.length+' / 220';\n    let timer;\n    input.addEventListener('input',function(){\n      count.textContent=input.value.length+' / 220';"""
          new_js="""    input.value=String(plan.heartMessage||'').slice(0,220);\n    const autoGrow=function(){\n      input.style.height='auto';\n      input.style.height=input.scrollHeight+'px';\n    };\n    autoGrow();\n    count.textContent=input.value.length+' / 220';\n    let timer;\n    input.addEventListener('input',function(){\n      autoGrow();\n      count.textContent=input.value.length+' / 220';"""
          if old_js not in s:
              raise SystemExit('Dear Note input handler marker not found')
          s=s.replace(old_js,new_js,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add approved-pages/dear-day-cart.js
          git commit -m "Disable Dear Note manual resize" || exit 0
          git push
