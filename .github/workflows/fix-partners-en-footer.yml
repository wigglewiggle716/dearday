name: Fix English partners footer only
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Run English partners footer fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared footer runtime only to English partners page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('approved-pages/Dear-Day-Partners-en.html')
          s = p.read_text()
          tag = '<script src="/approved-pages/dear-day-cart.js?v=20261004-5"></script>'
          if tag not in s:
              s = s.replace('</head>', tag + '\n</head>', 1)
              p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-partners-en-footer.yml
      - name: Commit only the requested page change
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add approved-pages/Dear-Day-Partners-en.html .github/workflows/fix-partners-en-footer.yml
          git commit -m 'Fix English partners footer to use shared site footer'
          git push
