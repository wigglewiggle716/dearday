name: Fix unified auth header state
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-auth-header-state.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth header runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          auth=Path('approved-pages/dear-day-auth-state.js')
          s=auth.read_text()
          s=s.replace('.dd-account-wrap{position:relative;display:inline-flex;align-items:center;z-index:2147482500}', '.dd-account-wrap{position:relative;display:inline-flex;align-items:center;z-index:2147482500;overflow:visible!important}')
          s=s.replace('.dd-account-menu{display:none;position:absolute;', '.dd-account-menu{display:none!important;position:absolute;')
          s=s.replace('.dd-account-wrap.open .dd-account-menu{display:block}', '.dd-account-wrap.open .dd-account-menu{display:block!important}')
          s=s.replace("actions.querySelectorAll('a.dd-auth,a.header-auth,.dd-user-chip,.dd-logout').forEach(el=>el.remove());const d=displayData(user);", "actions.querySelectorAll('a.dd-auth,a.header-auth,a.auth-link,.dd-user-chip,.dd-logout').forEach(el=>el.remove());actions.querySelectorAll('a[href*=\"Dear-Day-Auth\"]').forEach(a=>{const h=String(a.getAttribute('href')||'').toLowerCase();if(h.includes('#login')||h.includes('#signup'))a.remove()});const d=displayData(user);")
          old="const toggle=()=>{const open=!wrap.classList.contains('open');document.querySelectorAll('.dd-account-wrap.open').forEach(x=>{if(x!==wrap)x.classList.remove('open')});wrap.classList.toggle('open',open);trigger.setAttribute('aria-expanded',String(open))};trigger.addEventListener('click',e=>{e.stopPropagation();toggle()});"
          new="const toggle=()=>{const open=!wrap.classList.contains('open');document.querySelectorAll('.dd-account-wrap.open').forEach(x=>{if(x!==wrap){x.classList.remove('open');const m=x.querySelector('.dd-account-menu');if(m)m.style.setProperty('display','none','important')}});wrap.classList.toggle('open',open);const menu=wrap.querySelector('.dd-account-menu');if(menu)menu.style.setProperty('display',open?'block':'none','important');trigger.setAttribute('aria-expanded',String(open))};trigger.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggle()});"
          if old not in s: raise SystemExit('toggle target not found')
          s=s.replace(old,new)
          s=s.replace("w.classList.remove('open');w.querySelector('.dd-account-trigger')?.setAttribute('aria-expanded','false')", "w.classList.remove('open');const m=w.querySelector('.dd-account-menu');if(m)m.style.setProperty('display','none','important');w.querySelector('.dd-account-trigger')?.setAttribute('aria-expanded','false')")
          oldpaint="const paint=()=>{mountAccountMenu(currentUser,signOut);scrubBurgerAuthLinks(currentUser)};"
          if oldpaint not in s: raise SystemExit('paint target not found')
          s=s.replace(oldpaint,"const paint=()=>{mountAccountMenu(currentUser,signOut);scrubBurgerAuthLinks(currentUser);document.documentElement.classList.remove('dd-auth-session-hint')};")
          auth.write_text(s)
          nav=Path('approved-pages/dear-day-mobile-nav.js')
          n=nav.read_text()
          n=re.sub(r'/approved-pages/dear-day-auth-state\.js\?v=[^\'\"]+', '/approved-pages/dear-day-auth-state.js?v=20261003-4', n)
          nav.write_text(n)
          cart=Path('approved-pages/dear-day-cart.js')
          c=cart.read_text()
          marker="(function(){\n  const KEY='dearDayCart';"
          bootstrap="(function(){\n  function ddHasStoredSession(){try{for(const store of [localStorage,sessionStorage]){for(let i=0;i<store.length;i++){const k=String(store.key(i)||'');if(!/^sb-.*-auth-token$/i.test(k))continue;const raw=String(store.getItem(k)||'');if(raw.includes('access_token')&&raw.includes('user'))return true}}}catch(e){}return false}\n  if(ddHasStoredSession()){document.documentElement.classList.add('dd-auth-session-hint');const st=document.createElement('style');st.id='dd-auth-session-hint-style';st.textContent='.dd-auth-session-hint header a.dd-auth,.dd-auth-session-hint header a.header-auth,.dd-auth-session-hint header a.auth-link,.dd-auth-session-hint header a[href*=\\\"Dear-Day-Auth\\\"]{visibility:hidden!important;pointer-events:none!important}';(document.head||document.documentElement).appendChild(st)}\n  const KEY='dearDayCart';"
          if marker not in c: raise SystemExit('cart marker not found')
          c=c.replace(marker,bootstrap,1)
          c=re.sub(r'/approved-pages/dear-day-mobile-nav\.js\?v=[^\'\"]+', '/approved-pages/dear-day-mobile-nav.js?v=20261003-4', c)
          cart.write_text(c)
          for file in [Path('index.html'),Path('index-en.html')]:
              h=file.read_text()
              h=re.sub(r'/approved-pages/dear-day-cart\.js\?v=[^\'\"<]+', '/approved-pages/dear-day-cart.js?v=20261003-4', h)
              file.write_text(h)
          PY
          git rm .github/workflows/fix-auth-header-state.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix unified logged-in header state and account menu'
          git push