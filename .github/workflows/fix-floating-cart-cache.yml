name: Fix Floating Cart Cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-floating-cart-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make cart visible by default and bust cached script refs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js=Path('approved-pages/dear-day-cart.js')
          s=js.read_text(encoding='utf-8')
          old="opacity:0;visibility:hidden;transform:translateY(8px) scale(.96);"
          new="opacity:1;visibility:visible;transform:translateY(0) scale(1);"
          if old in s:
              s=s.replace(old,new,1)
          js.write_text(s,encoding='utf-8')

          for p in Path('.').rglob('*.html'):
              original=p.read_text(encoding='utf-8')
              x=original
              x=x.replace('src="/approved-pages/dear-day-cart.js"','src="/approved-pages/dear-day-cart.js?v=20260930-3"')
              x=x.replace('src="dear-day-cart.js"','src="dear-day-cart.js?v=20260930-3"')
              x=x.replace('src="/approved-pages/dear-day-cart.js?v=20260930-2"','src="/approved-pages/dear-day-cart.js?v=20260930-3"')
              if x!=original:
                  p.write_text(x,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add approved-pages/dear-day-cart.js '*.html' approved-pages/*.html
          git commit -m "Fix floating cart visibility and bust cache" || exit 0
          git push
# trigger
