name: Compact venues sort control
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-venues-sort-control.yml'
permissions:
  contents: write
jobs:
  compact-sort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compact venues sort styles
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('venues.html'),
              Path('venues-en.html'),
              Path('approved-pages/Dear-Day-Venues-Approved.html'),
              Path('approved-pages/Dear-Day-Venues-Approved-en.html'),
          ]
          marker = 'id="dd-venues-compact-sort"'
          style = '<style id="dd-venues-compact-sort">.section-title{align-items:center!important}.section-title h2{white-space:nowrap!important}.section-title>.sort,.section-title>.dd-select-shell{width:180px!important;min-width:180px!important;max-width:180px!important;flex:0 0 180px!important}.section-title .dd-select-trigger{width:180px!important;min-width:180px!important;max-width:180px!important;padding-inline:12px!important}.section-title .dd-select-menu{min-width:220px!important;max-width:260px!important}@media(max-width:620px){.section-title{align-items:flex-start!important}.section-title h2{white-space:normal!important}.section-title>.sort,.section-title>.dd-select-shell,.section-title .dd-select-trigger{width:165px!important;min-width:165px!important;max-width:165px!important}.section-title>.sort,.section-title>.dd-select-shell{flex-basis:165px!important}}</style>'
          for path in files:
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  print('already styled', path)
                  continue
              if '</head>' not in text:
                  raise SystemExit(f'{path}: missing </head>')
              path.write_text(text.replace('</head>', style + '\n</head>', 1), encoding='utf-8')
              print('updated', path)
          PY
      - name: Verify compact sort
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in ['venues.html','venues-en.html','approved-pages/Dear-Day-Venues-Approved.html','approved-pages/Dear-Day-Venues-Approved-en.html']:
              s=Path(p).read_text(encoding='utf-8')
              assert 'id="dd-venues-compact-sort"' in s
              assert '.section-title h2{white-space:nowrap!important}' in s
              assert 'width:180px!important' in s
              print('verified', p)
          PY
      - name: Commit compact venues sort
        run: |
          git config user.name 'Dear Day Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add venues.html venues-en.html approved-pages/Dear-Day-Venues-Approved.html approved-pages/Dear-Day-Venues-Approved-en.html
          git diff --cached --quiet && exit 0
          git commit -m 'Compact venues sort control'
          git push origin main
