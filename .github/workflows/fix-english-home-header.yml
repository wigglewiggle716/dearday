name: Fix English Home
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-english-home-header.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch English homepage
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index-en.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<header class="home-header">','<header class="home-header" data-dd-global-nav="1">',1)
          s = s.replace('Your occasion, every detail,<br/>all in one place','Your occasion. Every detail.<br/>All in one place.',1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add index-en.html
          git commit -m "Fix English header and headline" || exit 0
          git push