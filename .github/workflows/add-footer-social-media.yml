name: Add Dear Day footer social media
on:
  push:
    paths:
      - '.github/workflows/add-footer-social-media.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add shared social footer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64
          p=Path('approved-pages/dear-day-cart.js')
          s=p.read_text(encoding='utf-8')
          block=base64.b64decode('').decode()
          css=base64.b64decode('').decode()
          if 'function patchSocialFooter()' not in s:
              s=s.replace('  function patchReviewConsent(){\n',block+'  function patchReviewConsent(){\n',1)
          if '    patchSocialFooter();\n' not in s:
              s=s.replace('    patchRefundPolicyLink();\n','    patchRefundPolicyLink();\n    patchSocialFooter();\n',1)
          if '.dd-social-footer{' not in s:
              s=s.replace('      .dd-legal-links a:hover{text-decoration:underline!important;text-underline-offset:3px}\n','      .dd-legal-links a:hover{text-decoration:underline!important;text-underline-offset:3px}\n'+css,1)
          p.write_text(s,encoding='utf-8')
          for f in list(Path('.').glob('*.html'))+list(Path('approved-pages').glob('*.html')):
              text=f.read_text(encoding='utf-8')
              if 'dear-day-cart.js?v=' not in text: continue
              newer=re.sub(r'(dear-day-cart\.js\?v=)[0-9-]+',r'\g<1>20261003-7',text)
              if newer!=text:f.write_text(newer,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add approved-pages/dear-day-cart.js '*.html' approved-pages/'*.html'
          git diff --cached --quiet || git commit -m "Add social media icons to customer footers"
          git push
