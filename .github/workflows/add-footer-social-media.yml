name: Add Dear Day footer social media
on:
  push:
    paths:
      - '.github/workflows/add-footer-social-media.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add shared social footer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('approved-pages/dear-day-cart.js')
          s=p.read_text(encoding='utf-8')

          if 'function patchSocialFooter()' not in s:
              anchor='  function patchReviewConsent(){\n'
              block=r'''  function patchSocialFooter(){
    const english=isEnglishPage();
    document.querySelectorAll('footer,.dd-occ-footer').forEach(footer=>{
      if(footer.querySelector('.dd-social-footer'))return;
      const host=footer.querySelector('.footer-top')||footer.querySelector('.wrap')||footer;
      if(!host)return;
      const social=document.createElement('div');
      social.className='dd-social-footer';
      social.innerHTML=`
        <h4>${english?'Social Media':'وسائل التواصل الاجتماعي'}</h4>
        <div class="dd-social-icons" aria-label="${english?'Dear Day social media':'وسائل التواصل الاجتماعي الخاصة بـ Dear Day'}">
          <a href="#" data-dd-social="facebook" aria-label="Facebook" title="Facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.6 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.7V4a23 23 0 0 0-2.5-.1c-2.5 0-4.2 1.5-4.2 4.4V10H7.4v3h2.8v8h3.4Z"/></svg></a>
          <a href="#" data-dd-social="instagram" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.7" r="1" class="dd-social-fill"/></svg></a>
          <a href="#" data-dd-social="x" aria-label="X" title="X"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l14 16M19 4 5 20"/></svg></a>
          <a href="#" data-dd-social="youtube" aria-label="YouTube" title="YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8.2a3 3 0 0 0-2.1-2.1C17 5.6 12 5.6 12 5.6s-5 0-6.9.5A3 3 0 0 0 3 8.2 31 31 0 0 0 2.6 12 31 31 0 0 0 3 15.8a3 3 0 0 0 2.1 2.1c1.9.5 6.9.5 6.9.5s5 0 6.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .4-3.8 31 31 0 0 0-.4-3.8Z"/><path d="m10 9 5 3-5 3V9Z" class="dd-social-fill"/></svg></a>
          <a href="#" data-dd-social="snapchat" aria-label="Snapchat" title="Snapchat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.8c-2.8 0-4.4 2.1-4.4 4.8 0 .5.1 1.1 0 1.5-.2.5-1 .8-1.6 1.1-.5.2-.9.5-.8.9.1.5.9.7 1.7.9.3.1.5.3.6.7.3 1 1 1.8 2 2.2.4.2.6.8.8 1.3.4-.1 1-.4 1.7-.4s1.3.3 1.7.4c.2-.5.4-1.1.8-1.3 1-.4 1.7-1.2 2-2.2.1-.4.3-.6.6-.7.8-.2 1.6-.4 1.7-.9.1-.4-.3-.7-.8-.9-.6-.3-1.4-.6-1.6-1.1-.1-.4 0-1 0-1.5 0-2.7-1.6-4.8-4.4-4.8Z"/></svg></a>
          <a href="#" data-dd-social="linkedin" aria-label="LinkedIn" title="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="9" width="3" height="10"/><circle cx="5.5" cy="5.5" r="1.7" class="dd-social-fill"/><path d="M10 19V9h3v1.5c.7-1.1 1.8-1.8 3.5-1.8 2.7 0 3.5 1.8 3.5 4.6V19h-3v-5.1c0-1.4-.3-2.5-1.8-2.5-1.6 0-2.2 1.1-2.2 2.9V19h-3Z"/></svg></a>
        </div>`;
      host.appendChild(social);
      social.querySelectorAll('a[data-dd-social]').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
    });
  }

'''
              if anchor not in s: raise SystemExit('review anchor missing')
              s=s.replace(anchor,block+anchor,1)

          call='    patchRefundPolicyLink();\n'
          if '    patchSocialFooter();\n' not in s:
              if call not in s: raise SystemExit('patchPage anchor missing')
              s=s.replace(call,call+'    patchSocialFooter();\n',1)

          css_anchor='      .dd-legal-links a:hover{text-decoration:underline!important;text-underline-offset:3px}\n'
          css=r'''      .dd-social-footer{grid-column:1/-1!important;width:100%!important;margin-top:24px!important;padding-top:22px!important;border-top:1px solid rgba(255,255,255,.16)!important}
      .dd-social-footer h4{margin:0 0 13px!important;color:#fff!important;font-size:14px!important;font-weight:800!important}
      .dd-social-icons{display:flex!important;align-items:center!important;gap:9px!important;flex-wrap:wrap!important}
      .dd-social-icons a{width:38px!important;height:38px!important;margin:0!important;padding:0!important;border:1px solid rgba(255,255,255,.30)!important;border-radius:50%!important;display:grid!important;place-items:center!important;color:#fff!important;background:rgba(255,255,255,.06)!important;text-decoration:none!important;transition:background .18s ease,border-color .18s ease,transform .18s ease!important;cursor:default!important}
      .dd-social-icons a:hover{background:rgba(255,255,255,.14)!important;border-color:rgba(255,255,255,.55)!important;transform:translateY(-2px)!important}
      .dd-social-icons svg{width:18px!important;height:18px!important;display:block!important;fill:none!important;stroke:currentColor!important;stroke-width:1.8!important;stroke-linecap:round!important;stroke-linejoin:round!important}
      .dd-social-icons svg path:first-child:not(.dd-social-fill),.dd-social-icons svg rect:not(.dd-social-fill){fill:none!important}
      .dd-social-icons svg .dd-social-fill{fill:currentColor!important;stroke:none!important}
'''
          if '.dd-social-footer{' not in s:
              if css_anchor not in s: raise SystemExit('css anchor missing')
              s=s.replace(css_anchor,css_anchor+css,1)

          p.write_text(s,encoding='utf-8')

          # Bump the shared runtime query across customer-facing HTML so the footer patch is picked up reliably.
          for f in list(Path('.').glob('*.html'))+list(Path('approved-pages').glob('*.html')):
              text=f.read_text(encoding='utf-8')
              newer=re.sub(r'(dear-day-cart\.js\?v=)[0-9-]+',r'\g<1>20261003-7',text)
              if newer!=text:f.write_text(newer,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add approved-pages/dear-day-cart.js '*.html' approved-pages/'*.html'
          git diff --cached --quiet || git commit -m "Add social media icons to customer footers"
          git push
