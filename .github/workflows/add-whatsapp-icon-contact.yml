name: Add WhatsApp icon contact
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-whatsapp-icon-contact.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add WhatsApp icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('approved-pages/Dear-Day-Contact.html')
          s=p.read_text(encoding='utf-8')
          old='<a class="quick-btn whatsapp" href="https://wa.me/201000000000" target="_blank" rel="noopener">WhatsApp</a>'
          new='<a class="quick-btn whatsapp" href="https://wa.me/201000000000" target="_blank" rel="noopener" aria-label="تواصل معنا عبر WhatsApp"><svg class="wa-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2a9.84 9.84 0 0 0-8.42 14.92L2 22l5.23-1.58A9.96 9.96 0 1 0 12.04 2Zm0 17.94a8.13 8.13 0 0 1-4.14-1.14l-.3-.18-3.1.94.98-3.02-.2-.31A8.05 8.05 0 1 1 12.04 19.94Zm4.42-6.03c-.24-.12-1.43-.7-1.65-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.4-.4-.54-.41h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.58.18 1.1.16 1.51.1.46-.07 1.43-.58 1.63-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28Z"/></svg><span>WhatsApp</span></a>'
          if old not in s:
              raise SystemExit('WhatsApp button not found')
          s=s.replace(old,new,1)
          marker='.quick-btn.whatsapp{background:#efe3df;color:var(--wine)}'
          if marker in s and '.wa-icon{' not in s:
              s=s.replace(marker, marker+'.wa-icon{width:20px;height:20px;display:block;flex:0 0 auto}',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add approved-pages/Dear-Day-Contact.html
          git commit -m 'Add WhatsApp icon to contact button'
          git push
