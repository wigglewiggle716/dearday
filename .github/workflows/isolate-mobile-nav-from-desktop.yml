name: Isolate mobile nav from desktop
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/isolate-mobile-nav-from-desktop.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply desktop header isolation
        run: python .github/scripts/isolate_mobile_nav.py
      - name: Commit changes
        run: |
          rm .github/workflows/isolate-mobile-nav-from-desktop.yml
          rm .github/scripts/isolate_mobile_nav.py
          git config user.name "Dear Day Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Keep mobile navigation off desktop"
          git push
