name: Venues copy direction fix
on:
  push:
    paths:
      - '.github/workflows/venues-copy-direction-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix desktop hero copy direction
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
            ('venues.html','rtl'),
            ('venues-en.html','ltr'),
            ('approved-pages/Dear-Day-Venues-Approved.html','rtl'),
            ('approved-pages/Dear-Day-Venues-Approved-en.html','ltr'),
          ]
          for name, direction in files:
            p = Path(name)
            s = p.read_text(encoding='utf-8')
            old = '.hero-copy{display:flex;'
            new = f'.hero-copy{{direction:{direction};display:flex;'
            if new not in s:
              if old not in s:
                raise RuntimeError(f'hero copy block not found: {name}')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Dear Day Automation"
          git config user.email "actions@users.noreply.github.com"
          git add venues.html venues-en.html approved-pages/Dear-Day-Venues-Approved.html approved-pages/Dear-Day-Venues-Approved-en.html
          git commit -m "Fix venues hero copy direction" || exit 0
          git push
