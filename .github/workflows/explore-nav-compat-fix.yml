name: Explore navigation compatibility fix
on:
  push:
    paths:
      - '.github/workflows/explore-nav-compat-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent legacy English nav rewrite after Explore is mounted
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('approved-pages/dear-day-mobile-nav.js')
          s=p.read_text(encoding='utf-8')
          old="""    if(nav){\n      const current=[...nav.querySelectorAll(':scope>a')].map(a=>[String(a.textContent||'').trim(),a.getAttribute('href')||'']);"""
          new="""    if(nav&&!nav.querySelector('.dd-explore-nav')){\n      const current=[...nav.querySelectorAll(':scope>a')].map(a=>[String(a.textContent||'').trim(),a.getAttribute('href')||'']);"""
          if old not in s:
              raise SystemExit('Target block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit compatibility fix
        run: |
          git config user.name "Dear Day Automation"
          git config user.email "actions@users.noreply.github.com"
          git add approved-pages/dear-day-mobile-nav.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Keep Explore nav stable on English How It Works"
          git push
