name: Fix Arabic live header
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-arabic-live-header.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Arabic headers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('how-it-works.html'),
              Path('partners.html'),
              Path('approved-pages/Dear-Day-How-It-Works.html'),
              Path('approved-pages/Dear-Day-Partners.html'),
          ]

          for p in files:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              if not re.search(r'<html[^>]+(?:lang="ar"|dir="rtl")', s, re.I):
                  continue
              active_how = 'How-It-Works' in p.name or p.name == 'how-it-works.html'
              active_partners = 'Partners' in p.name or p.name == 'partners.html'
              nav = '''<nav class="home-nav" aria-label="التنقل الرئيسي" data-dd-explore-version="20261006-3"><a href="/"{home}>الرئيسية</a><div class="dd-static-explore dd-explore-nav"><button class="dd-static-explore-trigger" type="button" aria-haspopup="true" aria-expanded="false"><span>اكتشف</span><span class="dd-chevron" aria-hidden="true">⌄</span></button><div class="dd-static-explore-menu"><a href="/gifts">هدايا</a><a href="/cake">كيك وحلويات</a><a href="/venues">أماكن وتجارب</a><a href="/flowers">ورد</a></div></div><a href="/occasions">المناسبات</a><a href="/how-it-works"{how}>كيف نعمل</a><a href="/partners"{partners}>للشركاء</a></nav>'''.format(
                  home='',
                  how=' class="active"' if active_how else '',
                  partners=' class="active"' if active_partners else ''
              )
              s2, n = re.subn(r'<nav class="home-nav"[^>]*>.*?</nav>', nav, s, count=1, flags=re.S)
              if n:
                  p.write_text(s2, encoding='utf-8')
                  print('fixed', p)
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-arabic-live-header.yml
      - name: Commit fix
        run: |
          git config user.name "Dear Day Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Fix Arabic live Explore headers"
            git push
          fi
