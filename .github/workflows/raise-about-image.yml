name: Raise About image
on:
  push:
    paths:
      - '.github/workflows/raise-about-image.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raise Who We Are image on desktop
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('approved-pages/Dear-Day-About.html')
          s=p.read_text()
          marker='.purpose{background:var(--ivory);padding:96px 0}'
          rule='@media(min-width:981px){.who-visual{transform:translateY(-92px);margin-bottom:-92px}}\n'
          if rule not in s:
              s=s.replace(marker, rule+marker)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add approved-pages/Dear-Day-About.html
          git commit -m 'Raise About image to align with copy' || exit 0
          git push
