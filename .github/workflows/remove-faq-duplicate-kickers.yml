name: Remove FAQ duplicate kickers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-faq-duplicate-kickers.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate FAQ section kickers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['approved-pages/Dear-Day-FAQ.html','approved-pages/Dear-Day-FAQ-en.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s,n=re.subn(r'<div class="group-head"><span>.*?</span><h2>', '<div class="group-head"><h2>', s)
              if n<1:
                  raise SystemExit(f'No group-head kickers removed in {name}')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add approved-pages/Dear-Day-FAQ.html approved-pages/Dear-Day-FAQ-en.html
          git commit -m "Remove duplicate FAQ section labels"
          git push
