name: Account deletion and legal restore

on:
  push:
    paths:
      - '.github/workflows/account-deletion-legal-restore.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Dear Day account deletion and legal fixes
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s):
              Path(p).parent.mkdir(parents=True,exist_ok=True)
              Path(p).write_text(s,encoding='utf-8')

          # 1) Customer account pages: add a real account-deletion request area.
          for path,en in [('Dear-Day-Account.html',False),('Dear-Day-Account-en.html',True)]:
              s=read(path)
              if 'accountDeletionCard' not in s:
                  css='''\n.danger-zone{margin-top:20px;border-color:rgba(154,69,69,.28);background:#fffaf9}.danger-zone h2{color:#8e3939}.danger-zone p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.8}.delete-account-btn{min-height:44px;border:1px solid #a85a5a;background:#fff;color:#8e3939;border-radius:13px;padding:0 15px;font:700 13px inherit;cursor:pointer}.delete-account-btn:hover{background:#fff2f0}.delete-account-btn:disabled{opacity:.55;cursor:not-allowed}.deletion-status{margin-top:10px!important;font-size:12px!important}.danger-note{padding:11px 13px;border-radius:13px;background:#fff4f1;border:1px solid rgba(168,88,61,.18);font-size:12px!important}\n'''
                  s=s.replace('</style>',css+'</style>',1)
                  if en:
                      block='''\n  <section class="card danger-zone" id="accountDeletionCard"><h2>Account & data deletion</h2><p>Request permanent deletion of your Dear Day account and personal data. The request is reviewed by Dear Day before deletion is completed.</p><p class="danger-note">After approval, your sign-in account and personal profile data are permanently removed. Historical order records may be retained only in a de-identified form where required for operational, accounting, legal or dispute records.</p><button id="requestAccountDeletion" class="delete-account-btn" type="button">Request account deletion</button><p id="deletionStatus" class="status deletion-status"></p></section>\n'''
                  else:
                      block='''\n  <section class="card danger-zone" id="accountDeletionCard"><h2>حذف الحساب والبيانات</h2><p>يمكنك تقديم طلب لحذف حساب Dear Day وبياناتك الشخصية نهائيًا. يراجع Dear Day الطلب قبل تنفيذ الحذف.</p><p class="danger-note">بعد الموافقة، يتم حذف حساب تسجيل الدخول وبيانات الملف الشخصي نهائيًا. قد تُحفظ السجلات التاريخية للطلبات بعد فصلها عن هويتك فقط عند الحاجة التشغيلية أو المحاسبية أو القانونية أو لتسوية نزاع.</p><button id="requestAccountDeletion" class="delete-account-btn" type="button">طلب حذف الحساب</button><p id="deletionStatus" class="status deletion-status"></p></section>\n'''
                  s=s.replace('  <a class="back"',block+'  <a class="back"',1)
              s=s.replace('dear-day-account.js?v=20261003-6','dear-day-account.js?v=20261003-7')
              write(path,s)

          # 2) Account JS: submit request and show current status.
          p='approved-pages/dear-day-account.js'; s=read(p)
          if 'requestAccountDeletion()' not in s:
              funcs=r'''
  async function loadDeletionRequest(){
    const btn=document.getElementById('requestAccountDeletion');if(!btn)return;
    const {data,error}=await supabase.rpc('my_account_deletion_request');
    if(error){status('deletionStatus',t('تعذر تحميل حالة طلب الحذف.','Could not load deletion request status.'),true);return}
    const r=Array.isArray(data)?data[0]:data;
    if(!r){btn.disabled=false;btn.textContent=t('طلب حذف الحساب','Request account deletion');status('deletionStatus','');return}
    if(r.status==='pending'){
      btn.disabled=true;btn.textContent=t('الطلب قيد المراجعة','Request under review');
      status('deletionStatus',t('تم استلام طلب حذف الحساب وهو الآن بانتظار مراجعة Dear Day.','Your deletion request has been received and is waiting for Dear Day review.'));
      return;
    }
    if(r.status==='rejected'){
      btn.disabled=false;btn.textContent=t('تقديم طلب حذف جديد','Submit a new deletion request');
      status('deletionStatus',t('تمت مراجعة الطلب السابق ولم تتم الموافقة عليه. يمكنك التواصل مع خدمة العملاء أو تقديم طلب جديد.','Your previous request was reviewed and was not approved. You can contact support or submit a new request.'),true);
      return;
    }
  }

  async function requestAccountDeletion(){
    const btn=document.getElementById('requestAccountDeletion');if(!btn)return;
    const msg=t('هل أنت متأكد من تقديم طلب حذف حسابك وبياناتك نهائيًا؟ لن يتم الحذف فورًا؛ سيقوم Dear Day بمراجعة الطلب أولًا.','Are you sure you want to request permanent deletion of your account and personal data? Deletion is not immediate; Dear Day will review the request first.');
    if(!confirm(msg))return;
    btn.disabled=true;status('deletionStatus',t('جاري إرسال الطلب…','Submitting request…'));
    const {error}=await supabase.rpc('request_account_deletion');
    if(error){btn.disabled=false;status('deletionStatus',error.message||t('تعذر إرسال الطلب.','Could not submit the request.'),true);return}
    await loadDeletionRequest();
  }

'''
              s=s.replace('  async function boot(){',funcs+'  async function boot(){',1)
              s=s.replace('    await ensureProfile();fill();await loadAddresses();','    await ensureProfile();fill();await loadAddresses();await loadDeletionRequest();',1)
              s=s.replace("    document.getElementById('verifyAction')?.addEventListener('click',continueSecurity);","    document.getElementById('verifyAction')?.addEventListener('click',continueSecurity);\n    document.getElementById('requestAccountDeletion')?.addEventListener('click',requestAccountDeletion);",1)
              write(p,s)

          # 3) Admin Customers: show deletion requests and allow Super Admin approval/rejection.
          p='Dear-Day-Admin-Customers.html'; s=read(p)
          if 'account-deletion-requests' not in s:
              css='''\n.deletion-panel{margin-top:18px;padding:18px}.deletion-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:12px}.deletion-head h2{margin:0;color:var(--wine);font-size:18px}.deletion-list{display:grid;gap:10px}.deletion-request{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fffaf8}.deletion-request-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.deletion-request strong{display:block}.deletion-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.approve-delete{border:0;background:#8e3939;color:#fff;border-radius:11px;padding:9px 12px;font:700 11px inherit;cursor:pointer}.reject-delete{border:1px solid var(--line);background:#fff;color:var(--wine);border-radius:11px;padding:9px 12px;font:700 11px inherit;cursor:pointer}@media(max-width:650px){.deletion-request-top{display:block}.deletion-request-top .badge{margin-top:7px}}\n'''
              s=s.replace('</style>',css+'</style>',1)
              block='''\n<section id="account-deletion-requests" class="panel deletion-panel" hidden><div class="deletion-head"><div><h2>طلبات حذف الحساب</h2><div class="muted">الموافقة النهائية متاحة للسوبر أدمن فقط.</div></div><span id="deletionPendingCount" class="badge">0</span></div><div id="deletionRequestsList" class="deletion-list"></div></section>\n'''
              s=s.replace('</main></div>',block+'</main></div>',1)
          s=s.replace('dear-day-admin-customers.js?v=20261002-1','dear-day-admin-customers.js?v=20261003-2')
          write(p,s)

          p='approved-pages/dear-day-admin-customers.js'; s=read(p)
          s=s.replace('let supabase,user,profile,customers=[],permissions=new Set(),selectedId=null;','let supabase,user,profile,customers=[],deletionRequests=[],permissions=new Set(),selectedId=null;')
          if 'loadDeletionRequests' not in s:
              funcs=r'''
  async function loadDeletionRequests(){
    const panel=$('account-deletion-requests');if(!panel)return;
    if(profile?.role!=='super_admin'){panel.hidden=true;return}
    panel.hidden=false;
    const {data,error}=await supabase.rpc('admin_account_deletion_list');
    if(error)throw error;
    deletionRequests=data||[];renderDeletionRequests();
    if(location.hash==='#account-deletion-requests')setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'start'}),80);
  }

  function renderDeletionRequests(){
    const host=$('deletionRequestsList'),count=$('deletionPendingCount');if(!host)return;
    const pending=deletionRequests.filter(r=>r.status==='pending');if(count)count.textContent=String(pending.length);
    const rows=[...pending,...deletionRequests.filter(r=>r.status!=='pending').slice(0,8)];
    if(!rows.length){host.innerHTML='<div class="muted">لا توجد طلبات حذف حساب.</div>';return}
    host.innerHTML=rows.map(r=>`<article class="deletion-request"><div class="deletion-request-top"><div><strong>${esc(r.full_name||r.email||'عميل Dear Day')}</strong><div class="muted">${esc(r.email||'—')}${r.phone?' · '+esc(r.phone):''}</div><div class="muted">تاريخ الطلب: ${date(r.requested_at)}</div></div><span class="badge ${r.status==='pending'?'bad':'good'}">${r.status==='pending'?'بانتظار المراجعة':r.status==='completed'?'تم الحذف':'مرفوض'}</span></div>${r.status==='pending'?`<div class="deletion-actions"><button class="approve-delete" data-delete-approve="${esc(r.id)}" type="button">موافقة وحذف نهائي</button><button class="reject-delete" data-delete-reject="${esc(r.id)}" type="button">رفض الطلب</button></div>`:''}${r.admin_note?`<div class="muted" style="margin-top:7px">ملاحظة: ${esc(r.admin_note)}</div>`:''}</article>`).join('');
    host.querySelectorAll('[data-delete-approve]').forEach(b=>b.addEventListener('click',()=>reviewDeletion(b.dataset.deleteApprove,'approve')));
    host.querySelectorAll('[data-delete-reject]').forEach(b=>b.addEventListener('click',()=>reviewDeletion(b.dataset.deleteReject,'reject')));
  }

  async function reviewDeletion(id,decision){
    const req=deletionRequests.find(r=>r.id===id);if(!req)return;
    if(decision==='approve'){
      const who=req.full_name||req.email||'العميل';
      if(!confirm(`تأكيد الحذف النهائي لحساب ${who}؟ سيتم حذف حساب تسجيل الدخول والبيانات الشخصية، وفصل السجلات التاريخية عن هوية العميل.`))return;
    }
    const note=prompt(decision==='reject'?'سبب الرفض أو ملاحظة للسجل (اختياري):':'ملاحظة داخلية عن الحذف (اختياري):','')||null;
    const {error}=await supabase.rpc('admin_review_account_deletion',{p_request_id:id,p_decision:decision,p_note:note});
    if(error){show('errorBox',error.message||'تعذر مراجعة طلب حذف الحساب.');return}
    show('successBox',decision==='approve'?'تم حذف الحساب والبيانات الشخصية نهائيًا.':'تم رفض طلب الحذف.');
    closeDrawer();await loadCustomers();await loadDeletionRequests();
  }

'''
              s=s.replace('  function openDrawer()',funcs+'  function openDrawer()',1)
              s=s.replace("$('refreshBtn').onclick=()=>loadCustomers().catch(e=>show('errorBox',e.message));","$('refreshBtn').onclick=()=>Promise.all([loadCustomers(),loadDeletionRequests()]).catch(e=>show('errorBox',e.message));",1)
              s=s.replace('      await loadCustomers();','      await loadCustomers();await loadDeletionRequests();',1)
              write(p,s)

          # 4) Notifications: account deletion notification opens Customers deletion section.
          p='approved-pages/dear-day-notifications.js'; s=read(p)
          if 'data-entity-type' not in s:
              s=s.replace('data-id="${esc(n.id)}"','data-id="${esc(n.id)}" data-entity-type="${esc(n.entity_type||\'\')}"')
              old="list.querySelectorAll('.notice.unread').forEach(el=>el.addEventListener('click',async()=>{const {error}=await supabase.rpc('mark_notification_read',{p_notification_id:el.dataset.id});if(!error){el.classList.remove('unread');el.querySelector('.dot')?.remove();refresh().catch(()=>{})}}));"
              new="list.querySelectorAll('.notice').forEach(el=>el.addEventListener('click',async()=>{if(el.classList.contains('unread')){const {error}=await supabase.rpc('mark_notification_read',{p_notification_id:el.dataset.id});if(!error){el.classList.remove('unread');el.querySelector('.dot')?.remove();}}if(el.dataset.entityType==='account_deletion_request'){location.href='/Dear-Day-Admin-Customers.html#account-deletion-requests';return}refresh().catch(()=>{})}));"
              s=s.replace(old,new)
              write(p,s)
          np='Dear-Day-Notifications.html'; ns=read(np).replace('dear-day-notifications.js?v=20261003-2','dear-day-notifications.js?v=20261003-3'); write(np,ns)

          # 5) Shared legal links + AR/EN switching.
          p='approved-pages/dear-day-cart.js'; s=read(p)
          replacement=r'''  function patchLegalFooterLinks(){
    const english=isEnglishPage();
    document.querySelectorAll('footer,.dd-occ-footer').forEach(footer=>{
      footer.querySelectorAll('a').forEach(a=>{
        const t=String(a.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
        if(english&&t==='privacy policy')a.href='/approved-pages/Dear-Day-Privacy-en.html';
        if(english&&(t==='terms & conditions'||t==='terms and conditions'))a.href='/approved-pages/Dear-Day-Terms-en.html';
        if(!english&&t==='سياسة الخصوصية')a.href='/approved-pages/Dear-Day-Privacy.html';
        if(!english&&t==='الشروط والأحكام')a.href='/approved-pages/Dear-Day-Terms.html';
      });
      footer.querySelectorAll('.footer-bottom div,.footer-bottom span').forEach(el=>{
        const t=String(el.textContent||'').replace(/\s+/g,' ').trim();
        if(english&&/^Privacy Policy\s*[·|•-]\s*Terms & Conditions$/i.test(t)){
          el.classList.add('dd-legal-links');el.innerHTML='<a href="/approved-pages/Dear-Day-Privacy-en.html">Privacy Policy</a><span aria-hidden="true"> · </span><a href="/approved-pages/Dear-Day-Terms-en.html">Terms & Conditions</a>';
        }
        if(!english&&t==='سياسة الخصوصية · الشروط والأحكام'){
          el.classList.add('dd-legal-links');el.innerHTML='<a href="/approved-pages/Dear-Day-Privacy.html">سياسة الخصوصية</a><span aria-hidden="true"> · </span><a href="/approved-pages/Dear-Day-Terms.html">الشروط والأحكام</a>';
        }
      });
    });
  }

  function patchLegalLanguageSwitch(){
    const p=String(location.pathname||'');
    const map={
      '/approved-pages/Dear-Day-Privacy.html':['/approved-pages/Dear-Day-Privacy-en.html','EN','English'],
      '/approved-pages/Dear-Day-Privacy-en.html':['/approved-pages/Dear-Day-Privacy.html','AR','العربية'],
      '/approved-pages/Dear-Day-Terms.html':['/approved-pages/Dear-Day-Terms-en.html','EN','English'],
      '/approved-pages/Dear-Day-Terms-en.html':['/approved-pages/Dear-Day-Terms.html','AR','العربية']
    };
    const item=map[p];if(!item)return;
    const host=document.querySelector('.auth-actions')||document.querySelector('header');if(!host||host.querySelector('[data-dd-legal-lang]'))return;
    const a=document.createElement('a');a.href=item[0];a.textContent=item[1];a.setAttribute('aria-label',item[2]);a.setAttribute('data-dd-legal-lang','');a.className='lang-link';
    host.appendChild(a);
  }

'''
          s=re.sub(r'  function patchLegalFooterLinks\(\)\{.*?\n  \}\n\n(?=  function patchRefundPolicyLink)',replacement,s,flags=re.S)
          if 'patchLegalLanguageSwitch();' not in s:
              s=s.replace('    patchLegalFooterLinks();','    patchLegalFooterLinks();\n    patchLegalLanguageSwitch();',1)
          s=s.replace('/approved-pages/Dear-Day-Terms.html" target="_blank" rel="noopener">Terms & Conditions','/approved-pages/Dear-Day-Terms-en.html" target="_blank" rel="noopener">Terms & Conditions')
          write(p,s)

          # Cache-bust the shared runtime across customer-facing HTML.
          for f in Path('.').rglob('*.html'):
              if '.git' in f.parts: continue
              x=f.read_text(encoding='utf-8')
              y=re.sub(r'dear-day-cart\.js\?v=[0-9-]+','dear-day-cart.js?v=20261003-8',x)
              if y!=x:f.write_text(y,encoding='utf-8')

          # 6) Data deletion public instructions now point to the real in-account workflow.
          for path,en in [('approved-pages/Dear-Day-Data-Deletion.html',False),('approved-pages/Dear-Day-Data-Deletion-en.html',True)]:
              s=read(path)
              if en:
                  sec='''<section class="section"><h2>1. How to request deletion</h2><ol><li>Sign in to your Dear Day account.</li><li>Open <a href="/Dear-Day-Account-en.html" style="color:var(--terra);font-weight:800;text-decoration:underline">My Account</a>.</li><li>Go to <strong>Account & data deletion</strong> and choose <strong>Request account deletion</strong>.</li><li>Your request is recorded and a Super Admin is notified for review.</li><li>If approved, Dear Day permanently removes the sign-in account and personal profile data and de-identifies historical records that must be retained for operational, accounting, legal, refund, or dispute purposes.</li></ol><a class="cta" href="/Dear-Day-Account-en.html">Open My Account</a></section>'''
                  s=re.sub(r'<section class="section"><h2>1\. How to request deletion</h2>.*?</section>',sec,s,count=1,flags=re.S)
                  s=s.replace('href="/approved-pages/Dear-Day-Privacy.html"','href="/approved-pages/Dear-Day-Privacy-en.html"')
              else:
                  sec='''<section class="section"><h2>1. كيفية طلب حذف بياناتك</h2><ol><li>سجّل الدخول إلى حساب Dear Day.</li><li>افتح صفحة <a href="/Dear-Day-Account.html" style="color:var(--terra);font-weight:800;text-decoration:underline">حسابي</a>.</li><li>انتقل إلى قسم <strong>حذف الحساب والبيانات</strong> واضغط <strong>طلب حذف الحساب</strong>.</li><li>يتم تسجيل الطلب وإرسال إشعار للسوبر أدمن لمراجعته.</li><li>عند الموافقة، يحذف Dear Day حساب تسجيل الدخول وبيانات الملف الشخصي نهائيًا، ويتم فصل السجلات التاريخية التي يلزم الاحتفاظ بها تشغيليًا أو محاسبيًا أو قانونيًا أو لتسوية استرداد أو نزاع عن هوية العميل.</li></ol><a class="cta" href="/Dear-Day-Account.html">فتح حسابي</a></section>'''
                  s=re.sub(r'<section class="section"><h2>1\. كيفية طلب حذف بياناتك</h2>.*?</section>',sec,s,count=1,flags=re.S)
              write(path,s)

          # 7) Restore canonical English Privacy and Terms pages on the paths used previously.
          base_css='''<style>:root{--ivory:#FAF3EA;--paper:#FFFDFC;--wine:#6B3540;--footer:#5D0C1D;--terra:#A8583D;--ink:#352D2E;--muted:#756A68;--line:rgba(107,53,64,.16);--soft:#F6E7E1;--shadow:0 20px 55px rgba(78,32,39,.08)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.8}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}.home-header{min-height:88px;background:var(--ivory);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding:10px clamp(24px,5vw,82px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}.brand img{width:168px;height:62px;object-fit:contain}.home-nav{display:flex;justify-content:center;gap:28px;font-size:13px;font-weight:800}.auth-actions{display:flex;gap:8px;align-items:center}.auth-actions a{min-height:40px;padding:8px 14px;border:1px solid rgba(107,53,64,.28);border-radius:999px;color:var(--wine);font-size:12px;font-weight:800}.auth-actions .lang-link{width:40px;padding:0;display:grid;place-items:center}.legal-hero{background:linear-gradient(145deg,#fffdfb 0%,var(--ivory) 68%,#f5e3dc 100%);padding:76px 0 64px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--terra);font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.legal-hero h1{margin:8px 0 14px;color:var(--wine);font-family:Georgia,serif;font-size:clamp(40px,6vw,66px);line-height:1.15}.legal-hero p{max-width:820px;color:var(--muted);font-size:15px}.updated{display:inline-flex;margin-top:18px;padding:8px 12px;border-radius:999px;background:rgba(107,53,64,.07);color:var(--wine);font-size:12px;font-weight:700}.legal-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:44px;padding:54px 0 82px}.toc{position:sticky;top:108px;align-self:start;border:1px solid var(--line);border-radius:20px;padding:20px;background:#fff}.toc strong{display:block;color:var(--wine);margin-bottom:10px}.toc a{display:block;color:var(--muted);font-size:13px;padding:6px 0}.legal-card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:clamp(24px,4vw,46px);box-shadow:var(--shadow)}.intro-note{background:var(--soft);border-left:4px solid var(--terra);border-radius:13px;padding:17px 19px;margin-bottom:26px;color:#594b49;font-size:14px}.legal-section{padding:27px 0;border-top:1px solid var(--line)}.legal-section:first-of-type{border-top:0}.legal-section h2{margin:0 0 11px;color:var(--wine);font-family:Georgia,serif;font-size:22px}.legal-section p,.legal-section li{color:#5f5452;font-size:14px}.legal-section ul{padding-left:22px}.legal-section a{color:var(--terra);font-weight:700;text-decoration:underline}.dd-occ-footer{background:var(--footer);color:#f8e8eb;padding:48px 0 22px}.footer-top{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:36px}.footer-logo img{width:165px;filter:brightness(0) invert(1)}.footer-top h4{margin:0 0 14px;color:#fff}.footer-top a{display:block;color:#efd9de;margin:9px 0;font-size:14px}.footer-bottom{border-top:1px solid rgba(255,255,255,.24);margin-top:30px;padding-top:18px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#dcc2c8;font-size:13px}@media(max-width:900px){.home-nav{display:none}.legal-layout{grid-template-columns:1fr}.toc{display:none}.footer-top{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.wrap{width:min(100% - 26px,1120px)}.home-header{grid-template-columns:1fr auto;padding:8px 14px}.brand img{width:128px}.auth-actions>a:not(.lang-link){display:none}.legal-hero{padding:50px 0}.legal-layout{padding:32px 0 60px}.legal-card{padding:21px 17px}.footer-top{grid-template-columns:1fr}}</style>'''

