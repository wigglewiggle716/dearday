name: Account deletion and legal restore

on:
  push:
    paths:
      - '.github/workflows/account-deletion-legal-restore.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run patch
        shell: bash
        run: |
          git show cb329881d791856e400f8c13f5dab921877b7952:.github/workflows/account-deletion-legal-restore.yml > /tmp/old-workflow.yml
          sed -n "/cat > \/tmp\/patch.py <<'PY'/,/^          PY$/p" /tmp/old-workflow.yml | sed '1d;$d;s/^          //' > /tmp/patch.py
          sed -i 's/,replacement,s,flags=re.S)/,lambda m: replacement,s,flags=re.S)/' /tmp/patch.py
          python /tmp/patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add account deletion workflow and restore English legal pages"
            git push origin HEAD:main
          fi
