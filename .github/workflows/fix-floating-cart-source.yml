name: Fix Floating Cart Source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-floating-cart-source.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch floating cart visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('approved-pages/dear-day-cart.js')
          s = p.read_text(encoding='utf-8')
          old = "    const floating=ensureFloatingCart();\n    floating.classList.toggle('dd-cart-visible',n>0);\n    floating.setAttribute('aria-hidden',n>0?'false':'true');\n    floating.tabIndex=n>0?0:-1;\n    updateFloatingOffset();"
          new = "    const floating=ensureFloatingCart();\n    floating.classList.add('dd-cart-visible');\n    floating.setAttribute('aria-hidden','false');\n    floating.tabIndex=0;\n    const floatCount=floating.querySelector('.dd-float-count');\n    if(floatCount){\n      floatCount.textContent=n;\n      floatCount.style.display=n>0?'grid':'none';\n    }\n    updateFloatingOffset();"
          if old not in s:
              raise SystemExit('floating cart marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add approved-pages/dear-day-cart.js
          git commit -m "Keep floating cart icon visible" || exit 0
          git push
