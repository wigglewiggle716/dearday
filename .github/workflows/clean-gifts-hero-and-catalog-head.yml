name: Clean gifts hero and catalog heading
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-gifts-hero-and-catalog-head.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove step box and catalog heading
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('gifts.html'),
              Path('gifts-en.html'),
              Path('approved-pages/Dear-Day-Gifts-Approved.html'),
              Path('approved-pages/Dear-Day-Gifts-Approved-en.html'),
          ]
          style = '''<style id="dd-gifts-clean-hero-style">
.hero-box{grid-template-columns:1fr!important}
.hero-box>div:first-child{max-width:850px}
.catalog{padding-top:12px}
</style>'''

          for path in files:
              text = path.read_text(encoding='utf-8')
              # Remove the Current step / Personalise gifts box in the hero.
              text, step_n = re.subn(r'<div class="step">.*?<div class="progress">.*?</div></div>', '', text, count=1, flags=re.S)
              if step_n != 1:
                  raise SystemExit(f'{path}: expected one hero step box, found {step_n}')

              # Remove only the heading/description directly at the start of the catalog section.
              text, head_n = re.subn(
                  r'(<section class="catalog"><div class="container">)<div class="section-head"><div>.*?</div></div>',
                  r'\1', text, count=1, flags=re.S
              )
              if head_n != 1:
                  raise SystemExit(f'{path}: expected one catalog heading, found {head_n}')

              if 'id="dd-gifts-clean-hero-style"' not in text:
                  if '</head>' not in text:
                      raise SystemExit(f'{path}: missing </head>')
                  text = text.replace('</head>', style + '\n</head>', 1)

              path.write_text(text, encoding='utf-8')
              print('updated', path)
          PY
      - name: Verify cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
              'gifts.html':['اختيارك الحالي','اكتشف هدايا أخرى','الخطوة الحالية'],
              'gifts-en.html':['Your current selection','Explore more gifts','Current step'],
              'approved-pages/Dear-Day-Gifts-Approved.html':['اختيارك الحالي','اكتشف هدايا أخرى','الخطوة الحالية'],
              'approved-pages/Dear-Day-Gifts-Approved-en.html':['Your current selection','Explore more gifts','Current step'],
          }
          for p, forbidden in checks.items():
              s=Path(p).read_text(encoding='utf-8')
              for term in forbidden:
                  assert term not in s, f'{p}: still contains {term}'
              assert 'id="dd-gifts-clean-hero-style"' in s
              assert 'function renderCurrent(){if(!currentWrap)return;' in s
              print('verified', p)
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'Dear Day Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add gifts.html gifts-en.html approved-pages/Dear-Day-Gifts-Approved.html approved-pages/Dear-Day-Gifts-Approved-en.html
          git diff --cached --quiet && exit 0
          git commit -m 'Clean gifts hero and catalog headings'
          git push origin main
