name: Polish flowers catalog UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flowers-ui-polish.yml'
permissions:
  contents: write
jobs:
  flowers-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply flowers UI changes
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('approved-pages/dear-day-live-catalog.js')
          s = js.read_text(encoding='utf-8')

          old_host = "const host=document.createElement('main');host.id='ddLiveCatalog';host.innerHTML="
          new_host = "const host=document.createElement('main');host.id='ddLiveCatalog';if(section==='flowers')host.classList.add('dd-live-flowers');host.innerHTML="
          if old_host not in s:
              raise SystemExit('host anchor not found')
          s = s.replace(old_host, new_host, 1)

          demo = "${section==='flowers'?'<span class=\"dd-demo-pill\">'+T('نسخة تجريبية للاختبار','Demo catalog')+'</span>':''}"
          if demo not in s:
              raise SystemExit('demo badge anchor not found')
          s = s.replace(demo, '', 1)

          footer_anchor = "    const footer=document.querySelector('footer');"
          flower_sort = "    if(section==='flowers'){const sort=host.querySelector('#ddSort');if(sort)sort.innerHTML='<option value=\"featured\">'+T('الأكثر مناسبة','Recommended')+'</option><option value=\"price_asc\">'+T('السعر: الأقل أولًا','Price: low to high')+'</option><option value=\"price_desc\">'+T('السعر: الأعلى أولًا','Price: high to low')+'</option>';}\n    const footer=document.querySelector('footer');"
          if footer_anchor not in s:
              raise SystemExit('footer anchor not found')
          s = s.replace(footer_anchor, flower_sort, 1)
          js.write_text(s, encoding='utf-8')

          style = '''<style id="dd-flowers-ui2">
          #ddLiveCatalog.dd-live-flowers .dd-cat-filters{max-height:calc(100vh - 125px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(107,53,64,.32) transparent;scrollbar-gutter:stable}
          #ddLiveCatalog.dd-live-flowers .dd-cat-filters::-webkit-scrollbar{width:6px}
          #ddLiveCatalog.dd-live-flowers .dd-cat-filters::-webkit-scrollbar-thumb{background:rgba(107,53,64,.28);border-radius:999px}
          #ddLiveCatalog.dd-live-flowers .dd-cat-toolbar #ddSort{appearance:none!important;-webkit-appearance:none!important;width:190px!important;min-width:190px!important;height:44px!important;border:1px solid rgba(107,53,64,.18)!important;border-radius:14px!important;background:#fff!important;color:#352D2E!important;box-shadow:0 5px 14px rgba(76,31,36,.035)!important;font-weight:700!important;cursor:pointer!important;padding-inline:14px 34px!important}
          #ddLiveCatalog.dd-live-flowers .dd-cat-toolbar #ddSort:hover{border-color:rgba(107,53,64,.32)!important}
          #ddLiveCatalog.dd-live-flowers .dd-cat-toolbar #ddSort:focus{outline:none!important;border-color:#A8583D!important;box-shadow:0 0 0 4px rgba(168,88,61,.09)!important}
          @media(max-width:900px){#ddLiveCatalog.dd-live-flowers .dd-cat-filters{max-height:none;overflow:visible;overscroll-behavior:auto;scrollbar-gutter:auto}}
          </style>'''

          pages = [
              Path('approved-pages/Dear-Day-Flowers-Approved.html'),
              Path('approved-pages/Dear-Day-Flowers-Approved-en.html'),
          ]
          for p in pages:
              h = p.read_text(encoding='utf-8')
              if 'id="dd-flowers-ui2"' not in h:
                  if '</head>' not in h:
                      raise SystemExit(f'{p}: missing head')
                  h = h.replace('</head>', style + '\n</head>', 1)
              h = h.replace('dear-day-live-catalog.js?v=20261006-flowers-fix1','dear-day-live-catalog.js?v=20261006-flowers-ui2')
              p.write_text(h, encoding='utf-8')
          PY
      - name: Verify flowers UI
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('approved-pages/dear-day-live-catalog.js').read_text(encoding='utf-8')
          assert "if(section==='flowers')host.classList.add('dd-live-flowers')" in s
          assert "T('نسخة تجريبية للاختبار','Demo catalog')" not in s
          assert "T('الأكثر مناسبة','Recommended')" in s
          for p in ['approved-pages/Dear-Day-Flowers-Approved.html','approved-pages/Dear-Day-Flowers-Approved-en.html']:
              h = Path(p).read_text(encoding='utf-8')
              assert 'id="dd-flowers-ui2"' in h
              assert 'max-height:calc(100vh - 125px)' in h
              assert 'dear-day-live-catalog.js?v=20261006-flowers-ui2' in h
          print('flowers UI verified')
          PY
      - name: Commit flowers UI
        run: |
          git config user.name 'Dear Day Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add approved-pages/dear-day-live-catalog.js approved-pages/Dear-Day-Flowers-Approved.html approved-pages/Dear-Day-Flowers-Approved-en.html
          git diff --cached --quiet && exit 0
          git commit -m 'Polish flowers catalog filters and sort'
          git push origin main
