name: Install Explore navigation
on:
  push:
    paths:
      - '.github/workflows/install-explore-nav.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Explore navigation on public pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          tag = '<script src="/approved-pages/dear-day-explore-nav.js?v=20261006-1"></script>'
          files = {Path('index.html'), Path('index-en.html'), Path('how-it-works.html'), Path('how-it-works-en.html')}

          cfg = json.loads(Path('vercel.json').read_text(encoding='utf-8'))
          for item in cfg.get('rewrites', []):
              dest = str(item.get('destination') or '')
              if not dest.endswith('.html'):
                  continue
              p = Path(dest.lstrip('/'))
              files.add(p)

          changed=[]
          for p in sorted(files):
              if not p.exists() or p.suffix.lower() != '.html':
                  continue
              s = p.read_text(encoding='utf-8')
              if '<header' not in s.lower():
                  continue
              if 'dear-day-explore-nav.js' in s:
                  continue
              if re.search(r'</body\s*>', s, flags=re.I):
                  s = re.sub(r'</body\s*>', tag + '</body>', s, count=1, flags=re.I)
              else:
                  s += '\n' + tag + '\n'
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))

          print('Updated', len(changed), 'files')
          for p in changed: print(p)
          PY
      - name: Commit install
        run: |
          git config user.name "Dear Day Automation"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html' 'approved-pages/*.html'
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Install Explore dropdown across public pages"
          git push
