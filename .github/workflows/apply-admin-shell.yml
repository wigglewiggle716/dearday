name: Apply shared admin shell
on:
  push:
    paths:
      - '.github/workflows/apply-admin-shell.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject admin shell
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = list(Path('.').glob('Dear-Day-Admin*.html')) + [Path('Dear-Day-Finance.html'), Path('Dear-Day-Notifications.html')]
          tag = '<script src="/approved-pages/dear-day-admin-shell.js?v=20261003-1"></script>'
          changed=[]
          for p in targets:
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if 'class="sidebar"' not in s or 'class="main"' not in s:
                  continue
              if 'dear-day-admin-shell.js' in s:
                  continue
              if '</body>' not in s:
                  continue
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))
          print('Patched:', ', '.join(changed) or 'none')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dear-Day-Admin*.html Dear-Day-Finance.html Dear-Day-Notifications.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Use shared admin shell across admin pages"
            git push
          fi
