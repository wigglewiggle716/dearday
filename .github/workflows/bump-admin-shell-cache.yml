name: Bump shared admin shell cache
on:
  push:
    paths:
      - '.github/workflows/bump-admin-shell-cache.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump admin shell version
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for p in list(Path('.').glob('Dear-Day-Admin*.html'))+[Path('Dear-Day-Finance.html'),Path('Dear-Day-Notifications.html')]:
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              old=s
              s=s.replace('dear-day-admin-shell.js?v=20261003-1','dear-day-admin-shell.js?v=20261003-2')
              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('Updated',changed)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dear-Day-Admin*.html Dear-Day-Finance.html Dear-Day-Notifications.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh shared admin shell runtime"
            git push
          fi
