name: Add filter scroll navigator
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-filter-scroll-navigator.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add independent filter scrolling
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
            'gifts.html':114,
            'approved-pages/Dear-Day-Gifts-Approved.html':114,
            'gifts-en.html':128,
            'approved-pages/Dear-Day-Gifts-Approved-en.html':128,
            'cake.html':190,
            'approved-pages/Dear-Day-Cake-Approved.html':190,
            'cake-en.html':128,
            'approved-pages/Dear-Day-Cake-Approved-en.html':128,
            'venues.html':112,
            'approved-pages/Dear-Day-Venues-Approved.html':112,
            'venues-en.html':128,
            'approved-pages/Dear-Day-Venues-Approved-en.html':128,
          }

          for path, offset in files.items():
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if 'id="dd-filter-scroll-navigator"' in s:
                  continue
              css = f'''<style id="dd-filter-scroll-navigator">
          @media(min-width:901px){{
          .filters{{max-height:calc(100vh - {offset}px)!important;overflow-y:auto!important;overscroll-behavior:contain!important;scrollbar-width:thin;scrollbar-color:rgba(107,53,64,.32) transparent;scrollbar-gutter:stable}}
          .filters::-webkit-scrollbar{{width:6px}}
          .filters::-webkit-scrollbar-thumb{{background:rgba(107,53,64,.28);border-radius:999px}}
          }}
          @media(max-width:900px){{.filters{{max-height:none!important;overflow:visible!important;overscroll-behavior:auto!important;scrollbar-gutter:auto}}}}
          </style>
          '''
              if '</head>' not in s:
                  raise SystemExit('Missing head close: '+path)
              p.write_text(s.replace('</head>', css+'</head>', 1), encoding='utf-8')
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
            'gifts.html','approved-pages/Dear-Day-Gifts-Approved.html',
            'gifts-en.html','approved-pages/Dear-Day-Gifts-Approved-en.html',
            'cake.html','approved-pages/Dear-Day-Cake-Approved.html',
            'cake-en.html','approved-pages/Dear-Day-Cake-Approved-en.html',
            'venues.html','approved-pages/Dear-Day-Venues-Approved.html',
            'venues-en.html','approved-pages/Dear-Day-Venues-Approved-en.html',
          ]
          for path in files:
              s=Path(path).read_text(encoding='utf-8')
              assert 'id="dd-filter-scroll-navigator"' in s, path
              assert 'overflow-y:auto!important' in s, path
              assert 'overscroll-behavior:contain!important' in s, path
              assert '@media(max-width:900px)' in s, path
          print('Filter scroll navigator verified on all target pages')
          PY
      - name: Commit
        run: |
          git config user.name 'Dear Day Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add gifts.html gifts-en.html cake.html cake-en.html venues.html venues-en.html approved-pages/Dear-Day-Gifts-Approved.html approved-pages/Dear-Day-Gifts-Approved-en.html approved-pages/Dear-Day-Cake-Approved.html approved-pages/Dear-Day-Cake-Approved-en.html approved-pages/Dear-Day-Venues-Approved.html approved-pages/Dear-Day-Venues-Approved-en.html
          git commit -m 'Add independent scroll to catalog filters'
          git push origin main
