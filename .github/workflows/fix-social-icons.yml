name: Fix social media icons

on:
  push:
    paths:
      - '.github/workflows/fix-social-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply social icon patch
        shell: bash
        run: |
          python scripts/fix_social_icons.py
          node --check approved-pages/dear-day-cart.js
          grep -q "instagram:'<svg" approved-pages/dear-day-cart.js
          grep -q "youtube:'<svg" approved-pages/dear-day-cart.js
          grep -q "snapchat:'<svg" approved-pages/dear-day-cart.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace footer social placeholders with SVG icons"
          git push origin HEAD:main
