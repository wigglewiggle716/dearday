name: Bump account click fix runtime
on:
  push:
    paths:
      - '.github/workflows/bump-account-click-fix.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump shared customer runtime versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          mobile=Path('approved-pages/dear-day-mobile-nav.js')
          s=mobile.read_text(encoding='utf-8')
          s=re.sub(r'dear-day-auth-state\.js\?v=[^\"\']+', 'dear-day-auth-state.js?v=20261003-7', s)
          mobile.write_text(s,encoding='utf-8')

          cart=Path('approved-pages/dear-day-cart.js')
          s=cart.read_text(encoding='utf-8')
          s=re.sub(r'dear-day-mobile-nav\.js\?v=[^\"\']+', 'dear-day-mobile-nav.js?v=20261003-7', s)
          cart.write_text(s,encoding='utf-8')

          changed=[]
          for p in list(Path('.').glob('*.html')) + list(Path('approved-pages').glob('*.html')):
              s=p.read_text(encoding='utf-8')
              old=s
              s=re.sub(r'dear-day-cart\.js\?v=[^\"\']+', 'dear-day-cart.js?v=20261003-5', s)
              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('Updated HTML:', ', '.join(changed) or 'none')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add approved-pages/dear-day-mobile-nav.js approved-pages/dear-day-cart.js '*.html' approved-pages/*.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh account menu click runtime"
            git push
          fi
