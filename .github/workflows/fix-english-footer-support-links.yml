name: Fix English footer support links

on:
  push:
    paths:
      - '.github/workflows/fix-english-footer-support-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply footer support link patch
        run: |
          python scripts/fix_english_footer_support_links.py
          node --check approved-pages/dear-day-cart.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix English footer refund and deletion links"
            git push origin HEAD:main
          fi
