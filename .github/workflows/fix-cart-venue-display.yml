name: Fix cart venue display
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cart-venue-display.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use actual venue name in Arabic cart
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path('cart.html'), Path('approved-pages/Dear-Day-Cart.html')]
          pattern = r"item\.ar\s*\|\|\s*item\.name"
          replacement = "item.type==='venue'?(item.name||item.ar):(item.ar||item.name)"

          for path in files:
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 venue-title expression, found {count}')
              path.write_text(text, encoding='utf-8')
              print(f'updated {path}')
          PY
      - name: Verify venue display logic
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in ['cart.html','approved-pages/Dear-Day-Cart.html']:
              s=Path(p).read_text(encoding='utf-8')
              assert "item.type==='venue'?(item.name||item.ar):(item.ar||item.name)" in s
              print('verified', p)
          PY
      - name: Commit fix
        run: |
          git config user.name 'Dear Day Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add cart.html approved-pages/Dear-Day-Cart.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show actual venue names in cart'
          git push origin main

# one-time trigger v4
