name: Fix cart venue display
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cart-venue-display.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean venue name display logic
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('cart.html'), Path('approved-pages/Dear-Day-Cart.html')]
          duplicated = "item.type==='venue'?(item.name||item.ar):(item.type==='venue'?(item.name||item.ar):(item.ar||item.name))"
          clean = "item.type==='venue'?(item.name||item.ar):(item.ar||item.name)"

          for path in files:
              text = path.read_text(encoding='utf-8')
              count = text.count(duplicated)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 duplicated condition, found {count}')
              path.write_text(text.replace(duplicated, clean, 1), encoding='utf-8')
              print(f'cleaned {path}')
          PY
      - name: Verify final cart logic
        run: |
          python - <<'PY'
          from pathlib import Path
          duplicated = "item.type==='venue'?(item.name||item.ar):(item.type==='venue'?(item.name||item.ar):(item.ar||item.name))"
          clean = "item.type==='venue'?(item.name||item.ar):(item.ar||item.name)"
          for p in ['cart.html','approved-pages/Dear-Day-Cart.html']:
              s=Path(p).read_text(encoding='utf-8')
              assert clean in s
              assert duplicated not in s
              assert "(item.type==='venue'&&item.ar&&item.ar!==item.name)?item.ar:null" in s
              print('verified', p)
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'Dear Day Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add cart.html approved-pages/Dear-Day-Cart.html
          git diff --cached --quiet && exit 0
          git commit -m 'Clean cart venue name display logic'
          git push origin main

# one-time trigger v5
