name: Fix cart venue display
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cart-venue-display.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix venue title and description in Arabic cart
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('cart.html'), Path('approved-pages/Dear-Day-Cart.html')]
          old_title = "esc(item.ar||item.name)"
          new_title = "esc(item.type==='venue'?(item.name||item.ar):(item.ar||item.name))"
          old_meta = "esc([item.vendor,item.area,item.people,item.meta].filter(Boolean).join(' • '))"
          new_meta = "esc([(item.type==='venue'&&item.ar&&item.ar!==item.name)?item.ar:null,item.vendor,item.area,item.people,item.meta].filter(Boolean).join(' • '))"

          for path in files:
              text = path.read_text(encoding='utf-8')
              title_count = text.count(old_title)
              meta_count = text.count(old_meta)
              if title_count != 1:
                  raise SystemExit(f'{path}: expected 1 title match, found {title_count}')
              if meta_count != 1:
                  raise SystemExit(f'{path}: expected 1 meta match, found {meta_count}')
              text = text.replace(old_title, new_title)
              text = text.replace(old_meta, new_meta)
              path.write_text(text, encoding='utf-8')
              print(f'updated {path}')
          PY
      - name: Verify venue display logic
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in ['cart.html','approved-pages/Dear-Day-Cart.html']:
              s=Path(p).read_text(encoding='utf-8')
              assert "item.type==='venue'?(item.name||item.ar)" in s
              assert "item.type==='venue'&&item.ar&&item.ar!==item.name" in s
              print('verified', p)
          PY
      - name: Commit fix
        run: |
          git config user.name 'Dear Day Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add cart.html approved-pages/Dear-Day-Cart.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show actual venue names in cart'
          git push origin main

# one-time trigger v2
