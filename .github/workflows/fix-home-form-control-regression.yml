name: Fix home form control regression
on:
  push:
    paths:
      - '.github/workflows/fix-home-form-control-regression.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/fix_home_form_control_regression.py
      - run: node --check approved-pages/dear-day-cart.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Scope branded form controls away from home planner" || exit 0
          git push origin HEAD:main
