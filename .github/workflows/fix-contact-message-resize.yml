name: Fix Contact Message Resize
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-contact-message-resize.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable manual resize and auto-grow contact message
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['approved-pages/Dear-Day-Contact.html','approved-pages/Dear-Day-Contact-en.html']
          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              old='.field textarea{min-height:190px;resize:vertical}'
              new='.field textarea{min-height:190px;resize:none;overflow:hidden}'
              if old not in s:
                  raise SystemExit(f'CSS marker not found in {name}')
              s=s.replace(old,new,1)
              marker='<script>\n(function(){const form=document.getElementById(\'contactForm\');'
              if marker in s:
                  inject='<script>\n(function(){const message=document.getElementById(\'message\');if(message){const autoGrow=function(){message.style.height=\'auto\';message.style.height=message.scrollHeight+\'px\';};message.addEventListener(\'input\',autoGrow);autoGrow();}})();\n(function(){const form=document.getElementById(\'contactForm\');'
                  s=s.replace(marker,inject,1)
              else:
                  # Fallback for slightly different minified spacing
                  marker2='<script>\n(function(){'
                  if marker2 not in s:
                      raise SystemExit(f'Script marker not found in {name}')
                  inject2='<script>\n(function(){const message=document.getElementById(\'message\');if(message){const autoGrow=function(){message.style.height=\'auto\';message.style.height=message.scrollHeight+\'px\';};message.addEventListener(\'input\',autoGrow);autoGrow();}})();\n(function(){'
                  s=s.replace(marker2,inject2,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add approved-pages/Dear-Day-Contact.html approved-pages/Dear-Day-Contact-en.html
          git commit -m "Disable contact message manual resize" || exit 0
          git push
