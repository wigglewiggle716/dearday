name: Tune English home hero typography
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune-home-hero-typography.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align home hero Lora treatment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index-en.html')
          s=p.read_text(encoding='utf-8')
          old=".hero h1{font-size:clamp(26px,3.1vw,43px);line-height:1.65;margin:0 0 20px;font-weight:700}"
          new=".hero h1{font-size:clamp(38px,5vw,58px);line-height:1.18;margin:0 0 20px;font-weight:700}"
          if old not in s:
              raise SystemExit('desktop hero h1 rule not found')
          s=s.replace(old,new,1)
          old_mobile=".hero h1{font-size:28px}"
          new_mobile=".hero h1{font-size:36px;line-height:1.22}"
          if old_mobile not in s:
              raise SystemExit('mobile hero h1 rule not found')
          s=s.replace(old_mobile,new_mobile,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add index-en.html
          git commit -m "Align English home hero typography with Lora identity" || exit 0
          git push
