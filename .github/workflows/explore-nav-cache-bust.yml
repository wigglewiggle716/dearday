name: Explore navigation cache bust
on:
  push:
    paths:
      - '.github/workflows/explore-nav-cache-bust.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force browsers to load latest Explore navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          old='dear-day-explore-nav.js?v=20261006-1'
          new='dear-day-explore-nav.js?v=20261006-2'
          changed=[]
          for p in list(Path('.').glob('*.html')) + list(Path('approved-pages').glob('*.html')):
              s=p.read_text(encoding='utf-8')
              if old in s:
                  s=s.replace(old,new)
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          js=Path('approved-pages/dear-day-explore-nav.js')
          s=js.read_text(encoding='utf-8')
          s=s.replace("const VERSION='20261006-1';","const VERSION='20261006-2';")
          js.write_text(s,encoding='utf-8')
          print('cache-busted',len(changed),'HTML files')
          PY
      - name: Commit update
        run: |
          git config user.name "Dear Day Automation"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html' 'approved-pages/*.html' approved-pages/dear-day-explore-nav.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Force refresh Explore navigation"
          git push
