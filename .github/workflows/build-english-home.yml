            '>عرض الخيارات</button>':'>Show Options</button>',
            '<div class="section-head"><h2>هدايا وتجارب مختارة</h2></div>':'<div class="section-head"><h2>Handpicked gifts & experiences</h2></div>',
            'alt="باقة ورد أنيقة"':'alt="Elegant flower bouquet"',
