            'aria-label="إغلاق"':'aria-label="Close"',
            '>استكمل الاختيار</button>':'>Continue</button>',
            '<h2 id="ddPartnersShowcaseTitle">شركاء بيكمّلوا يومك</h2>':'<h2 id="ddPartnersShowcaseTitle">Partners that bring the day together</h2>',
            '<p>براندات، محلات وأماكن من الفئات الموجودة حاليًا على Dear Day — وكل ما الشبكة تكبر، الاختيارات قدامك بتكبر معاها.</p>':'<p>A growing network of brands, shops, venues and experiences across the categories available on Dear Day — giving you more ways to make the occasion feel like yours.</p>',
            '>انضم كشريك</a>':'>Become a Partner</a>',
            'aria-label="نماذج من شركاء Dear Day"':'aria-label="Examples of Dear Day partners"',
            '<p class="footer-note">مناسبات متفكّر فيها بعناية، متنسّقة في مكان واحد — من أول الفكرة لآخر تفصيلة.</p>':'<p class="footer-note">Thoughtfully planned occasions, coordinated in one place — from the first idea to the final detail.</p>',
            '<h4>خدمات Dear Day</h4>':'<h4>Dear Day Services</h4>',
            '>المناسبات</a>':'>Occasions</a>',
            '>الهدايا</a>':'>Gifts</a>',
            '>الكيك والحلويات</a>':'>Cakes & Sweets</a>',
            '>الأماكن والتجارب</a>':'>Venues & Experiences</a>',
            '<h4>عن Dear Day</h4>':'<h4>About Dear Day</h4>',
