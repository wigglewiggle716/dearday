            '<span>عيد ميلاد</span>':'<span>Birthday</span>',
            '<span>ذكرى سنوية</span>':'<span>Anniversary</span>',
            '<span>خطوبة</span>':'<span>Engagement</span>',
            '<span>طلب زواج</span>':'<span>Proposal</span>',
