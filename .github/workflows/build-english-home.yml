            '>كيف نعمل</a>':'>How It Works</a>',
            '>للشركاء</a>':'>For Partners</a>',
            '<h4>خدمة العملاء</h4>':'<h4>Customer Care</h4>',
            '>الأسئلة المتكررة</a>':'>FAQs</a>',
            '>تواصل معنا</a>':'>Contact Us</a>',
            'سياسة الخصوصية · الشروط والأحكام':'Privacy Policy · Terms & Conditions',
            "$('#feedback').textContent='اخترت '+occasion+' — حدّد المكان والتاريخ.';":"const chosenLabel={'عيد ميلاد':'Birthday','ذكرى سنوية':'Anniversary','خطوبة':'Engagement','طلب زواج':'Proposal'}[occasion]||occasion;$('#feedback').textContent='You selected '+chosenLabel+' — now choose your area, date and budget.';",
            "$('#feedback').textContent='اختار نوع المناسبة الأول.';":"$('#feedback').textContent='Choose an occasion first.';",
            "$('#feedback').textContent='اختار تاريخ المناسبة الأول.';":"$('#feedback').textContent='Choose the occasion date first.';",
            "$('#feedback').textContent='اختار مناسبة صحيحة.';":"$('#feedback').textContent='Choose a valid occasion.';",
            "$('#feedback').textContent='اختار ميزانية تقريبية أو اختار «غير محدد».';":"$('#feedback').textContent='Choose an approximate budget or select “Not sure yet”.';",
            "const budgetLabels={'under-1000':'أقل من 1,000','1000-2500':'1,000–2,500','2500-5000':'2,500–5,000','5000-plus':'5,000+','unsure':'غير محدد'};":"const budgetLabels={'under-1000':'Under EGP 1,000','1000-2500':'EGP 1,000–2,500','2500-5000':'EGP 2,500–5,000','5000-plus':'EGP 5,000+','unsure':'Not sure yet'};",
            "'0':{file:'/approved-pages/Dear-Day-Gifts-Approved.html',services:['هدايا'],cta:'استكمل في صفحة الهدايا'},":"'0':{file:'/approved-pages/Dear-Day-Gifts-Approved.html',services:['هدايا'],cta:'Continue to Gifts'},",
            "'1':{file:'/approved-pages/Dear-Day-Venues-Approved.html',services:['أماكن وتجارب'],cta:'استكمل في الأماكن والتجارب'},":"'1':{file:'/approved-pages/Dear-Day-Venues-Approved.html',services:['أماكن وتجارب'],cta:'Continue to Venues & Experiences'},",
            "'2':{file:'/approved-pages/Dear-Day-Cake-Approved.html',services:['كيك وحلويات'],cta:'استكمل في الكيك والحلويات'}":"'2':{file:'/approved-pages/Dear-Day-Cake-Approved.html',services:['كيك وحلويات'],cta:'Continue to Cakes & Sweets'}",
            "'under-1000':'أقل من 1,000',":"'under-1000':'Under EGP 1,000',",
            "'1000-2500':'1,000–2,500',":"'1000-2500':'EGP 1,000–2,500',",
            "'2500-5000':'2,500–5,000',":"'2500-5000':'EGP 2,500–5,000',",
            "'5000-plus':'5,000+',":"'5000-plus':'EGP 5,000+',",
            "'unsure':'غير محدد'":"'unsure':'Not sure yet'"
          }
          for old,new in replacements.items():
            if old not in s:
              print('WARN missing:', old[:90])
            s=s.replace(old,new)
          # English/LTR-specific visual overrides without disturbing approved layout.
          ltr='''\n<style id="dd-english-home-overrides">\nhtml,body{direction:ltr!important}body{text-align:left!important;font-family:Arial,Helvetica,sans-serif!important}\nheader,nav,.section-head,.occasions,.filters,.products,.steps,footer{direction:ltr!important}\n.home-header .brand{justify-content:flex-start!important}.home-header .auth-actions{justify-content:flex-end!important}\n.home-header .home-nav a,.wrap,.section-head,h2,h3,label,.feedback,.filters label,.filters input,.filters select,.product,.product>span:not(.arrow),.steps,.steps article,footer{text-align:left!important;direction:ltr!important}\n.hero,.hero-content{direction:ltr!important}.hero h1,.hero p{text-align:center!important}.hero h1,.hero-how h2,.section-head h2,.dd-partners-head h2{font-family:Lora,Georgia,'Times New Roman',serif!important}\n.filters select{background-position:calc(100% - 21px) 21px,calc(100% - 16px) 21px!important;padding-inline-start:12px!important;padding-inline-end:42px!important}\n.product img{order:0}.product>span:not(.arrow){order:1;padding:12px 10px 12px 0!important}\n.dd-partners-head{direction:ltr!important;text-align:left!important}.dd-partners-cta{align-self:auto}\n.dd-occ-footer,.dd-occ-footer .footer-top,.dd-occ-footer .footer-bottom{direction:ltr!important;text-align:left!important}\n@media(max-width:700px){nav{direction:ltr!important;text-align:left!important;align-items:flex-start!important}nav a{width:100%;text-align:left!important}.steps article{text-align:left!important;direction:ltr!important}footer{text-align:left!important;direction:ltr!important}}\n</style>\n'''
          s=s.replace('</head>',ltr+'</head>',1)
          Path('index-en.html').write_text(s,encoding='utf-8')
          PY
      - name: Commit English homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-en.html
          git commit -m 'Publish English homepage'
          git push
