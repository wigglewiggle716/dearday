            '<a class="active" href="index.html">الرئيسية</a>':'<a class="active" href="index-en.html">Home</a>',
            '<a href="#gifts">هدايا وتجارب</a>':'<a href="#gifts">Gifts & Experiences</a>',
            '<a href="#occasions">رتّب مناسبتي</a>':'<a href="#occasions">Plan My Occasion</a>',
