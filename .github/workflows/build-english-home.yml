name: Build English Home
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-english-home.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create English homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('index.html').read_text(encoding='utf-8')
          s=src
          replacements={
            '<html dir="rtl" lang="ar">':'<html dir="ltr" lang="en">',
            '<body dir="rtl">':'<body dir="ltr">',
            '<title>Dear Day — مناسبتك بكل تفاصيلها</title>':'<title>Dear Day — Every Detail, One Place</title>',
            '<meta name="description" content="رتّب مناسبتك في القاهرة والجيزة مع Dear Day. اكتشف الهدايا والكيك والأماكن والتجارب، واجمع اختياراتك وتفاصيل يومك في خطة واحدة تقدر تعدّلها وتراجعها بسهولة."/>':'<meta name="description" content="Plan birthdays, anniversaries, engagements and proposals in Cairo and Giza with Dear Day. Bring venues, experiences, gifts, cakes and more into one seamless plan."/>',
