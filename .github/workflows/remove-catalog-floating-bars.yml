name: Remove catalog floating bars
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-catalog-floating-bars.yml'
permissions:
  contents: write
jobs:
  remove-bars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove floating bars
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = [
            'gifts.html','gifts-en.html',
            'approved-pages/Dear-Day-Gifts-Approved.html','approved-pages/Dear-Day-Gifts-Approved-en.html',
            'cake.html','cake-en.html',
            'approved-pages/Dear-Day-Cake-Approved.html','approved-pages/Dear-Day-Cake-Approved-en.html',
            'venues.html','venues-en.html',
            'approved-pages/Dear-Day-Venues-Approved.html','approved-pages/Dear-Day-Venues-Approved-en.html'
          ]
          style='<style id="dd-hide-floating-flow-bar">.sticky,#sticky,#stickyBar{display:none!important}</style>\n'
          for path in pages:
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if 'id="dd-hide-floating-flow-bar"' not in s:
                  if '</head>' not in s:
                      raise SystemExit(f'No </head> in {path}')
                  s=s.replace('</head>',style+'</head>',1)
                  p.write_text(s,encoding='utf-8')

          p=Path('approved-pages/dear-day-live-catalog.js')
          s=p.read_text(encoding='utf-8')
          old="  function mountFlowerFlow(){if(section!=='flowers'||!flowActive()||document.getElementById('ddFlowerFlowBar'))return;"
          new="  function mountFlowerFlow(){if(section==='flowers')return;if(section!=='flowers'||!flowActive()||document.getElementById('ddFlowerFlowBar'))return;"
          if new not in s:
              if old not in s:
                  raise SystemExit('Flower flow function pattern not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          node --check approved-pages/dear-day-live-catalog.js
          python - <<'PY'
          from pathlib import Path
          pages = [
            'gifts.html','gifts-en.html',
            'approved-pages/Dear-Day-Gifts-Approved.html','approved-pages/Dear-Day-Gifts-Approved-en.html',
            'cake.html','cake-en.html',
            'approved-pages/Dear-Day-Cake-Approved.html','approved-pages/Dear-Day-Cake-Approved-en.html',
            'venues.html','venues-en.html',
            'approved-pages/Dear-Day-Venues-Approved.html','approved-pages/Dear-Day-Venues-Approved-en.html'
          ]
          for p in pages:
              s=Path(p).read_text(encoding='utf-8')
              assert 'id="dd-hide-floating-flow-bar"' in s
          s=Path('approved-pages/dear-day-live-catalog.js').read_text(encoding='utf-8')
          assert "function mountFlowerFlow(){if(section==='flowers')return;" in s
          print('Floating bars removed from all four catalog sections')
          PY
      - name: Commit
        run: |
          git config user.name 'Dear Day Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add gifts.html gifts-en.html cake.html cake-en.html venues.html venues-en.html approved-pages/Dear-Day-Gifts-Approved.html approved-pages/Dear-Day-Gifts-Approved-en.html approved-pages/Dear-Day-Cake-Approved.html approved-pages/Dear-Day-Cake-Approved-en.html approved-pages/Dear-Day-Venues-Approved.html approved-pages/Dear-Day-Venues-Approved-en.html approved-pages/dear-day-live-catalog.js
          git commit -m 'Remove floating bars from catalog pages'
          git push origin main
