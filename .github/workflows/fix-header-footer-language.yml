name: Unify Legal Footer Social Icons

on:
  push:
    branches:
      - audit/header-footer-language
    paths:
      - .github/workflows/fix-header-footer-language.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace old static social block with shared modern social block
        shell: python
        run: |
          from pathlib import Path
          p = Path('approved-pages/dear-day-cart.js')
          text = p.read_text(encoding='utf-8')
          old = "      const existing=footer.querySelector('.dd-social-footer');\n      if(existing)existing.remove();\n"
          new = "      footer.querySelectorAll('.dd-social-footer,.footer-social').forEach(el=>el.remove());\n"
          count = text.count(old)
          print('old social cleanup block count:', count)
          if count != 1:
              raise SystemExit(f'Expected exactly one old social cleanup block, found {count}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
      - name: Verify no navigation routes changed
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "approved-pages/dear-day-cart.js"
          if git diff -- approved-pages/dear-day-cart.js | grep -E '^[+-].*(href=|Dear-Day-|/approved-pages/)' | grep -v '^---' | grep -v '^+++'; then
            echo 'Unexpected route/link change detected'
            exit 1
          fi
          git diff -- approved-pages/dear-day-cart.js
      - name: Commit to main
        shell: bash
        run: |
          git config user.name "Dear Day Automation"
          git config user.email "actions@users.noreply.github.com"
          git add approved-pages/dear-day-cart.js
          git commit -m "Unify legal footer social icons"
          git push origin HEAD:main
