name: Fix Header Footer Language Links

on:
  push:
    branches:
      - audit/header-footer-language
    paths:
      - .github/workflows/fix-header-footer-language.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Normalize English header/footer routes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'Dear-Day-Auth-en.html': [
                  ('/approved-pages/Dear-Day-Occasions-Approved.html', '/approved-pages/Dear-Day-Occasions-Approved-en.html'),
                  ('/approved-pages/Dear-Day-Gifts-Approved.html', '/approved-pages/Dear-Day-Gifts-Approved-en.html'),
                  ('/approved-pages/Dear-Day-Cake-Approved.html', '/approved-pages/Dear-Day-Cake-Approved-en.html'),
                  ('/approved-pages/Dear-Day-Venues-Approved.html', '/approved-pages/Dear-Day-Venues-Approved-en.html'),
              ],
              'approved-pages/Dear-Day-About-en.html': [
                  ('/Dear-Day-Auth.html#login', '/Dear-Day-Auth-en.html#login'),
                  ('/Dear-Day-Auth.html#signup', '/Dear-Day-Auth-en.html#signup'),
                  ('/approved-pages/Dear-Day-Gifts-Approved.html', '/approved-pages/Dear-Day-Gifts-Approved-en.html'),
                  ('/approved-pages/Dear-Day-Cake-Approved.html', '/approved-pages/Dear-Day-Cake-Approved-en.html'),
                  ('/approved-pages/Dear-Day-Venues-Approved.html', '/approved-pages/Dear-Day-Venues-Approved-en.html'),
              ],
              'approved-pages/Dear-Day-Contact-en.html': [
                  ('/Dear-Day-Auth.html#login', '/Dear-Day-Auth-en.html#login'),
                  ('/Dear-Day-Auth.html#signup', '/Dear-Day-Auth-en.html#signup'),
                  ('/approved-pages/Dear-Day-Gifts-Approved.html', '/approved-pages/Dear-Day-Gifts-Approved-en.html'),
                  ('/approved-pages/Dear-Day-Cake-Approved.html', '/approved-pages/Dear-Day-Cake-Approved-en.html'),
                  ('/approved-pages/Dear-Day-Venues-Approved.html', '/approved-pages/Dear-Day-Venues-Approved-en.html'),
              ],
              'approved-pages/Dear-Day-FAQ-en.html': [
                  ('/Dear-Day-Auth.html#login', '/Dear-Day-Auth-en.html#login'),
                  ('/Dear-Day-Auth.html#signup', '/Dear-Day-Auth-en.html#signup'),
                  ('/approved-pages/Dear-Day-Gifts-Approved.html', '/approved-pages/Dear-Day-Gifts-Approved-en.html'),
                  ('/approved-pages/Dear-Day-Cake-Approved.html', '/approved-pages/Dear-Day-Cake-Approved-en.html'),
                  ('/approved-pages/Dear-Day-Venues-Approved.html', '/approved-pages/Dear-Day-Venues-Approved-en.html'),
              ],
              'approved-pages/Dear-Day-Partners-en.html': [
                  ('/Dear-Day-Auth.html#login', '/Dear-Day-Auth-en.html#login'),
                  ('/Dear-Day-Auth.html#signup', '/Dear-Day-Auth-en.html#signup'),
                  ('/approved-pages/Dear-Day-Gifts-Approved.html', '/approved-pages/Dear-Day-Gifts-Approved-en.html'),
                  ('/approved-pages/Dear-Day-Cake-Approved.html', '/approved-pages/Dear-Day-Cake-Approved-en.html'),
                  ('/approved-pages/Dear-Day-Venues-Approved.html', '/approved-pages/Dear-Day-Venues-Approved-en.html'),
              ],
              'index-en.html': [
                  ('/approved-pages/Dear-Day-Gifts-Approved.html', '/approved-pages/Dear-Day-Gifts-Approved-en.html'),
                  ('/approved-pages/Dear-Day-Cake-Approved.html', '/approved-pages/Dear-Day-Cake-Approved-en.html'),
                  ('/approved-pages/Dear-Day-Venues-Approved.html', '/approved-pages/Dear-Day-Venues-Approved-en.html'),
                  ('/approved-pages/Dear-Day-About.html', '/approved-pages/Dear-Day-About-en.html'),
              ],
          }

          changed = []
          total = 0
          for filename, pairs in replacements.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              before = text
              file_count = 0
              for old, new in pairs:
                  count = text.count(old)
                  if count:
                      text = text.replace(old, new)
                      file_count += count
              if text != before:
                  p.write_text(text, encoding='utf-8')
                  changed.append((filename, file_count))
                  total += file_count

          print('Changed files:')
          for name, count in changed:
              print(f'  {name}: {count} replacements')
          print(f'Total replacements: {total}')
          if len(changed) != 6:
              raise SystemExit(f'Expected 6 changed files, got {len(changed)}')
          if total < 30:
              raise SystemExit(f'Expected at least 30 replacements, got {total}')
      - name: Commit fixes to main
        run: |
          git config user.name "Dear Day Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Dear-Day-Auth-en.html approved-pages/Dear-Day-About-en.html approved-pages/Dear-Day-Contact-en.html approved-pages/Dear-Day-FAQ-en.html approved-pages/Dear-Day-Partners-en.html index-en.html
          git diff --cached --check
          git commit -m "Fix English header and footer language routes"
          git push origin HEAD:main
