name: Fix Legal Footer Override

on:
  push:
    branches:
      - audit/header-footer-language
    paths:
      - .github/workflows/fix-header-footer-language.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Stop runtime legal footer replacement
        shell: python
        run: |
          from pathlib import Path
          p = Path('approved-pages/dear-day-cart.js')
          text = p.read_text(encoding='utf-8')
          needle = '    normalizeLegalFooter();\n'
          count = text.count(needle)
          print('normalizeLegalFooter call count:', count)
          if count != 1:
              raise SystemExit(f'Expected exactly one normalizeLegalFooter() call, found {count}')
          text = text.replace(needle, '    // Keep each legal page footer markup and its existing link destinations unchanged.\n', 1)
          p.write_text(text, encoding='utf-8')
      - name: Verify only intended JS call changed
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "approved-pages/dear-day-cart.js"
          if git diff -- approved-pages/dear-day-cart.js | grep -E '^[+-].*(href=|Dear-Day-|/approved-pages/)' | grep -v '^---' | grep -v '^+++'; then
            echo 'Unexpected route/link change detected'
            exit 1
          fi
          git diff -- approved-pages/dear-day-cart.js
      - name: Commit fix to main
        shell: bash
        run: |
          git config user.name "Dear Day Automation"
          git config user.email "actions@users.noreply.github.com"
          git add approved-pages/dear-day-cart.js
          git commit -m "Stop overriding legal page footer structure"
          git push origin HEAD:main
