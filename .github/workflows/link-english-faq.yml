name: Link English FAQ
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-english-faq.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link FAQ language versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          faq=Path('approved-pages/Dear-Day-FAQ.html')
          s=faq.read_text(encoding='utf-8')
          canonical='<link rel="canonical" href="https://deardayy.vercel.app/approved-pages/Dear-Day-FAQ.html">'
          alternates='\n<link rel="alternate" hreflang="ar" href="https://deardayy.vercel.app/approved-pages/Dear-Day-FAQ.html">\n<link rel="alternate" hreflang="en" href="https://deardayy.vercel.app/approved-pages/Dear-Day-FAQ-en.html">'
          if 'hreflang="en"' not in s:
              s=s.replace(canonical,canonical+alternates,1)
          old='<div class="auth-actions"><a href="/Dear-Day-Auth.html#login">تسجيل الدخول</a><a href="/Dear-Day-Auth.html#signup">إنشاء حساب</a></div>'
          new='<div class="auth-actions"><a href="/Dear-Day-Auth.html#login">تسجيل الدخول</a><a href="/Dear-Day-Auth.html#signup">إنشاء حساب</a><a class="lang-link" href="/approved-pages/Dear-Day-FAQ-en.html" aria-label="English">EN</a></div>'
          if old in s:
              s=s.replace(old,new,1)
          faq.write_text(s,encoding='utf-8')

          for name in ['index-en.html','approved-pages/Dear-Day-About-en.html','approved-pages/Dear-Day-Partners-en.html']:
              p=Path(name)
              if not p.exists():
                  continue
              x=p.read_text(encoding='utf-8')
              x=x.replace('/approved-pages/Dear-Day-FAQ.html','/approved-pages/Dear-Day-FAQ-en.html')
              p.write_text(x,encoding='utf-8')

          sitemap=Path('sitemap.xml')
          x=sitemap.read_text(encoding='utf-8')
          url='https://deardayy.vercel.app/approved-pages/Dear-Day-FAQ-en.html'
          if url not in x:
              entry=f'  <url><loc>{url}</loc></url>\n'
              x=x.replace('</urlset>',entry+'</urlset>')
              sitemap.write_text(x,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add approved-pages/Dear-Day-FAQ.html index-en.html approved-pages/Dear-Day-About-en.html approved-pages/Dear-Day-Partners-en.html sitemap.xml
          git commit -m "Link English FAQ across site" || exit 0
          git push
