name: Compact unified footer proportionally
on:
  push:
    paths:
      - '.github/footer-social-trigger'
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply proportional footer scale
        run: python3 .github/scripts/compact_footer.py
      - name: Commit compact footer scale
        run: |
          git config user.name "wigglewiggle716"
          git config user.email "wigglewiggle716@gmail.com"
          git add approved-pages/dear-day-cart.js
          git diff --cached --quiet && exit 0
          git commit -m "Scale unified footer down proportionally"
          git push origin main
