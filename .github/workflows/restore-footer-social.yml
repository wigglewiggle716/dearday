name: Restore footer social icons
on:
  push:
    paths:
      - '.github/footer-social-trigger'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore working social footer function
        run: |
          git show 22d56e5d252d5a865caa55f1424579e97101daa2:approved-pages/dear-day-cart.js > /tmp/old-cart.js
          python3 - <<'PY'
          from pathlib import Path
          cur=Path('approved-pages/dear-day-cart.js')
          s=cur.read_text()
          old=Path('/tmp/old-cart.js').read_text()
          marker='  function patchSocialFooter(){'
          next_marker='\n  function patchMobileFooterAccordion(){'
          a=s.index(marker)
          b=s.index(next_marker,a)
          oa=old.index(marker)
          ob=old.index(next_marker,oa)
          working=old[oa:ob]
          cur.write_text(s[:a]+working+s[b:])
          PY
      - name: Commit footer social restore
        run: |
          git config user.name "wigglewiggle716"
          git config user.email "wigglewiggle716@gmail.com"
          git add approved-pages/dear-day-cart.js
          git diff --cached --quiet && exit 0
          git commit -m "Restore social icons in active footer script"
          git push origin main
