name: Restore stacked footer social and payment sections
on:
  push:
    paths:
      - '.github/footer-social-trigger'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore stacked footer sections
        run: |
          git checkout 5b7cde3ba8e6307605a9af61cbfb8408a9bfc960 -- approved-pages/dear-day-cart.js
      - name: Commit stacked footer restore
        run: |
          git config user.name "wigglewiggle716"
          git config user.email "wigglewiggle716@gmail.com"
          git add approved-pages/dear-day-cart.js
          git diff --cached --quiet && exit 0
          git commit -m "Restore stacked social and payment footer sections"
          git push origin main
