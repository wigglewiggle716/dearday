name: Restore footer social icons
on:
  push:
    paths:
      - '.github/footer-social-trigger'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore social row in unified footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('approved-pages/dear-day-cart-core.js')
          s=p.read_text()
          start=s.index('function normalizeGlobalFooter()')
          end=s.index('function ensureMobileDateStyle()', start)
          block=s[start:end]
          if 'dd-social-footer' not in block:
              needle='''        <div class="dd-payment-footer"><h4>${p.footer[10]}</h4>'''
              social='''        <div class="dd-social-footer" aria-label="${english?'Social media':'وسائل التواصل الاجتماعي'}"><h4>${english?'Follow Dear Day':'تابع Dear Day'}</h4><div class="dd-social-icons"><span class="dd-social-icon" aria-label="Facebook" title="Facebook">f</span><span class="dd-social-icon" aria-label="Instagram" title="Instagram">◎</span><span class="dd-social-icon" aria-label="X" title="X">𝕏</span><span class="dd-social-icon" aria-label="YouTube" title="YouTube">▶</span><span class="dd-social-icon" aria-label="Snapchat" title="Snapchat">♙</span><span class="dd-social-icon" aria-label="LinkedIn" title="LinkedIn">in</span></div></div>\n'''
              if needle not in block:
                  raise SystemExit('Unified footer insertion point not found')
              block=block.replace(needle,social+needle,1)
              s=s[:start]+block+s[end:]
          style_anchor='''  function normalizeGlobalFooter(){'''
          if 'dd-social-footer-style' not in s:
              css='''  function ensureSocialFooterStyle(){\n    if(document.getElementById('dd-social-footer-style'))return;\n    const style=document.createElement('style');\n    style.id='dd-social-footer-style';\n    style.textContent=`\n      .dd-social-footer{margin-top:26px!important;padding-top:22px!important;border-top:1px solid rgba(255,255,255,.18)!important}\n      .dd-social-footer h4{margin:0 0 12px!important;color:#fff!important;font-size:14px!important}\n      .dd-social-icons{display:flex!important;align-items:center!important;gap:10px!important;flex-wrap:wrap!important}\n      .dd-social-icon{width:38px!important;height:38px!important;border:1px solid rgba(255,255,255,.3)!important;border-radius:50%!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;color:#fff!important;font:700 15px/1 Arial,sans-serif!important;background:rgba(255,255,255,.06)!important}\n    `;\n    document.head.appendChild(style);\n  }\n'''
              s=s.replace(style_anchor,css+style_anchor,1)
          call='''    const english=isEnglishPage(),p=localePaths();'''
          segment=s[start:s.index('let footers=',start)]
          if 'ensureSocialFooterStyle();' not in segment:
              s=s[:start]+s[start:].replace(call,call+'\n    ensureSocialFooterStyle();',1)
          p.write_text(s)
          PY
      - name: Commit footer social restore
        run: |
          git config user.name "wigglewiggle716"
          git config user.email "wigglewiggle716@gmail.com"
          git add approved-pages/dear-day-cart-core.js
          git diff --cached --quiet && exit 0
          git commit -m "Restore social media icons to unified footer"
          git push origin main
