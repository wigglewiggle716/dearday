name: Disable legacy global header injector
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disable-legacy-global-header.yml'
permissions:
  contents: write
jobs:
  disable-header-injector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop cart scripts from replacing the static header
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          core = Path('approved-pages/dear-day-cart-core.js')
          s = core.read_text(encoding='utf-8')
          pattern = r"  function normalizeGlobalHeader\(\)\{.*?\n  \}\n  function ensureSocialFooterStyle\(\)\{"
          replacement = "  function normalizeGlobalHeader(){\n    // The page HTML is the single source of truth for navigation.\n    // Cart code must never replace or rebuild the header.\n    return document.querySelector('header') || null;\n  }\n  function ensureSocialFooterStyle(){"
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError(f'normalizeGlobalHeader block matched {n} times')
          if 'header.innerHTML=`' in s2 and 'dd-global-nav' in s2:
              raise RuntimeError('legacy header builder still remains inside cart core')
          core.write_text(s2, encoding='utf-8')

          site = Path('approved-pages/assets/site-nav.js')
          site.write_text("""(function(){
  function syncNav(){
    // Navigation comes from the page HTML. Never normalize/rebuild it here.
    if(window.DDCart&&typeof window.DDCart.paint==='function')window.DDCart.paint();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',syncNav);
  else syncNav();
})();
""", encoding='utf-8')

          # QA: the old injector markers must no longer be generated by either source.
          core_text = core.read_text(encoding='utf-8')
          site_text = site.read_text(encoding='utf-8')
          if "className='dd-global-header'" in core_text or 'class="dd-global-nav"' in core_text:
              raise RuntimeError('legacy global header generation still active')
          if 'normalizeHeader()' in site_text:
              raise RuntimeError('site-nav still invokes normalizeHeader')
          print('Legacy global-header injector disabled successfully')
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          rm -f .github/workflows/disable-legacy-global-header.yml
          git config user.name "Dear Day Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Disable legacy global header injector"
          git push
