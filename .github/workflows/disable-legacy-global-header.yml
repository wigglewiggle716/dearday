name: Disable legacy global header injector
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disable-legacy-global-header.yml'
permissions:
  contents: write
jobs:
  disable-header-injector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop cart scripts from replacing the static header
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          core = Path('approved-pages/dear-day-cart-core.js')
          s = core.read_text(encoding='utf-8')
          pattern = r"  function normalizeGlobalHeader\(\)\{.*?\n  \}\n  function ensureSocialFooterStyle\(\)\{"
          replacement = "  function normalizeGlobalHeader(){\n    // Page HTML is the single source of truth for navigation.\n    // Cart code must never replace or rebuild the header.\n    return document.querySelector('header') || null;\n  }\n  function ensureSocialFooterStyle(){"
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError(f'normalizeGlobalHeader block matched {n} times')
          core.write_text(s2, encoding='utf-8')

          site = Path('approved-pages/assets/site-nav.js')
          site_text = "(function(){\n  function syncNav(){\n    // Navigation comes from page HTML. Never normalize/rebuild it here.\n    if(window.DDCart&&typeof window.DDCart.paint==='function')window.DDCart.paint();\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',syncNav);\n  else syncNav();\n})();\n"
          site.write_text(site_text, encoding='utf-8')

          # QA: the active normalizer must be a no-op and site-nav must not call it.
          core_text = core.read_text(encoding='utf-8')
          m = re.search(r"function normalizeGlobalHeader\(\)\{(.*?)\n  \}", core_text, flags=re.S)
          if not m:
              raise RuntimeError('normalizeGlobalHeader function missing after patch')
          body = m.group(1)
          forbidden = ['innerHTML', 'className', 'ddGlobalNavVersion', 'ensureGlobalHeaderStyle']
          bad = [x for x in forbidden if x in body]
          if bad:
              raise RuntimeError(f'normalizeGlobalHeader still mutates header: {bad}')
          if 'normalizeHeader()' in site.read_text(encoding='utf-8'):
              raise RuntimeError('site-nav still invokes normalizeHeader')
          print('Legacy global-header injector disabled successfully')
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          rm -f .github/workflows/disable-legacy-global-header.yml
          git config user.name "Dear Day Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Disable legacy global header injector"
          git push
