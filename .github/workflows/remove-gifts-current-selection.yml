name: Remove gifts current selection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-gifts-current-selection.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove current selection section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('gifts.html'),
              Path('gifts-en.html'),
              Path('approved-pages/Dear-Day-Gifts-Approved.html'),
              Path('approved-pages/Dear-Day-Gifts-Approved-en.html'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              before = text
              text, n = re.subn(r'<section class="current">.*?</section>\s*', '', text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'{path}: expected one current section, found {n}')
              if 'function renderCurrent(){if(!currentWrap)return;' not in text:
                  text, m = re.subn(r'function renderCurrent\(\)\{', 'function renderCurrent(){if(!currentWrap)return;', text, count=1)
                  if m != 1:
                      raise SystemExit(f'{path}: renderCurrent function not found')
              path.write_text(text, encoding='utf-8')
              print('updated', path, len(before), '->', len(text))
          PY
      - name: Verify cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              'gifts.html','gifts-en.html',
              'approved-pages/Dear-Day-Gifts-Approved.html',
              'approved-pages/Dear-Day-Gifts-Approved-en.html'
          ]
          for p in files:
              s = Path(p).read_text(encoding='utf-8')
              assert '<section class="current">' not in s
              assert 'function renderCurrent(){if(!currentWrap)return;' in s
              print('verified', p)
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'Dear Day Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add gifts.html gifts-en.html approved-pages/Dear-Day-Gifts-Approved.html approved-pages/Dear-Day-Gifts-Approved-en.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove gifts current selection section'
          git push origin main
