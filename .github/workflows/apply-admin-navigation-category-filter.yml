name: Apply admin navigation and category filter
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-admin-navigation-category-filter.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch admin UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          admin_pages = [
              'Dear-Day-Admin.html',
              'Dear-Day-Admin-Orders.html',
              'Dear-Day-Admin-Partners.html',
              'Dear-Day-Admin-Products.html',
              'Dear-Day-Admin-Approvals.html',
              'Dear-Day-Admin-Availability.html',
              'Dear-Day-Admin-Refund-Policies.html',
              'Dear-Day-Admin-Cancellations.html',
              'Dear-Day-Admin-Customers.html',
              'Dear-Day-Admin-Employees.html',
              'Dear-Day-Finance.html',
          ]
          shell_tag = '<script src="/approved-pages/dear-day-admin-shell.js?v=20261003-1"></script>'
          for name in admin_pages:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if 'dear-day-admin-shell.js' not in text:
                  text = text.replace('</body>', shell_tag + '\n</body>')
              p.write_text(text, encoding='utf-8')

          hp = Path('Dear-Day-Admin-Products.html')
          html = hp.read_text(encoding='utf-8')
          html = re.sub(
              r'<select id="kindFilter">.*?</select>',
              '<select id="categoryFilter"><option value="">كل الأقسام</option></select>',
              html,
              count=1,
              flags=re.S,
          )
          html = html.replace('<th>النوع</th>', '<th>القسم</th>', 1)
          html = re.sub(r'dear-day-admin-products\.js\?v=[^"\']+', 'dear-day-admin-products.js?v=20261003-2', html)
          hp.write_text(html, encoding='utf-8')

          jp = Path('approved-pages/dear-day-admin-products.js')
          js = jp.read_text(encoding='utf-8')
          js = js.replace(
              "const currentPartnerFilter=$('partnerFilter').value,currentPartner=$('partnerId').value,currentCategory=$('categoryId').value;",
              "const currentPartnerFilter=$('partnerFilter').value,currentPartner=$('partnerId').value,currentCategory=$('categoryId').value,currentCategoryFilter=$('categoryFilter')?.value||'';"
          )
          marker = "$('categoryId').innerHTML='<option value=\"\">بدون تصنيف</option>'+categories.filter(c=>c.is_active).map(c=>`<option value=\"${c.id}\">${esc(c.name_ar||c.name_en||c.slug)}</option>`).join('');"
          if marker in js and "$('categoryFilter').innerHTML" not in js:
              js = js.replace(marker, marker + "\n    $('categoryFilter').innerHTML='<option value=\"\">كل الأقسام</option>'+categories.filter(c=>c.is_active).map(c=>`<option value=\"${c.id}\">${esc(c.name_ar||c.name_en||c.slug)}</option>`).join('');")
          restore = "if([...$('categoryId').options].some(o=>o.value===currentCategory))$('categoryId').value=currentCategory;"
          if restore in js and "currentCategoryFilter" in js and "categoryFilter').options" not in js:
              js = js.replace(restore, restore + "\n    if([...$('categoryFilter').options].some(o=>o.value===currentCategoryFilter))$('categoryFilter').value=currentCategoryFilter;")

          old_filtered = re.compile(r"  function filtered\(\)\{.*?\n  \}\n\n  function stockText", re.S)
          new_filtered = """  function filtered(){
    const q=$('searchInput').value.trim().toLowerCase(),pid=$('partnerFilter').value,categoryId=$('categoryFilter').value,av=$('availabilityFilter').value;
    return listings.filter(l=>{
      const v=latestFor(l.id)||publishedFor(l),p=partnerBy(l.partner_id),cat=categoryBy(l.category_id);
      const text=[v?.name_ar,v?.name_en,p?.name_ar,p?.name_en,cat?.name_ar,cat?.name_en,cat?.slug,kindLabel(l.kind)].join(' ').toLowerCase();
      if(q&&!text.includes(q))return false;
      if(pid&&l.partner_id!==pid)return false;
      if(categoryId&&l.category_id!==categoryId)return false;
      if(av==='available'&&!l.is_available)return false;
      if(av==='unavailable'&&l.is_available)return false;
      return true;
    });
  }

  function stockText"""
          js, n = old_filtered.subn(new_filtered, js, count=1)
          if n != 1:
              raise SystemExit('Could not replace filtered()')

          js = js.replace("<td>${kindLabel(l.kind)}</td>", "<td>${esc(cat?.name_ar||cat?.name_en||'بدون قسم')}</td>")
          js = js.replace("['searchInput','partnerFilter','kindFilter','availabilityFilter']", "['searchInput','partnerFilter','categoryFilter','availabilityFilter']")
          jp.write_text(js, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dear-Day-Admin*.html Dear-Day-Finance.html approved-pages/dear-day-admin-products.js
          git commit -m "Improve admin navigation, sidebar, and catalog filters"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git pull --rebase
          rm -f .github/workflows/apply-admin-navigation-category-filter.yml
          git add -A
          git commit -m "Remove temporary admin patch workflow"
          git push
