name: Remove FAQ sidebar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-faq-sidebar.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove FAQ category sidebar
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('approved-pages/Dear-Day-FAQ.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('.faq-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:54px;align-items:start}', '.faq-layout{display:block}')
          text=text.replace('.faq-content{display:grid;gap:54px}', '.faq-content{max-width:920px;margin:0 auto;display:grid;gap:54px}')
          text=text.replace('<aside class="faq-side"><h2>اختار القسم</h2><p>اضغط على أي قسم علشان تروح للأسئلة الخاصة بيه.</p><nav class="faq-nav"><a href="#about">عن Dear Day</a><a href="#booking">الحجز والتعديل</a><a href="#payment">الدفع</a><a href="#delivery">التنفيذ والدعم</a></nav></aside>\n', '')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add approved-pages/Dear-Day-FAQ.html
          git commit -m 'Remove FAQ category sidebar'
          git push
