name: Contact footer cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contact-footer-cleanup.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace customer service footer links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          changed=[]
          link_re=re.compile(r'<a\b[^>]*>\s*(حجوزاتي|الإلغاء والاسترداد|حسابي)\s*</a>')
          block_re=re.compile(r'(<h4>خدمة العملاء</h4>)(.*?)(</div>)',re.S)
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              def fix(m):
                  body=link_re.sub('',m.group(2))
                  if 'Dear-Day-Contact.html' not in body:
                      body += '<a href="/approved-pages/Dear-Day-Contact.html">تواصل معنا</a>'
                  return m.group(1)+body+m.group(3)
              ns=block_re.sub(fix,s)
              if ns!=s:
                  p.write_text(ns,encoding='utf-8')
                  changed.append(str(p))
          print('updated',len(changed),'files')
          print('\n'.join(changed))
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'approved-pages/*.html'
          git commit -m 'Replace footer account links with contact us'
          git push
