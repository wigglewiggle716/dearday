name: Content cleanup request
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/content-cleanup-request.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested content cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed=[]

          def save(p, old, new):
              if new != old:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))

          # Remove trial-copy from all HTML footers.
          files=[Path('index.html'), Path('Dear-Day-Auth.html')] + list(Path('approved-pages').glob('*.html'))
          for p in files:
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              ns=re.sub(r'\s*·?\s*نسخة تجريبية للموقع', '', s)
              save(p,s,ns)

          # Partners CTA.
          p=Path('approved-pages/Dear-Day-Partners.html')
          s=p.read_text(encoding='utf-8')
          ns=s.replace('<a class="secondary" href="#partnerNetwork">شوف شبكة الشركاء</a>','',1)
          save(p,s,ns)

          # Home helper sentence.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          ns=s.replace('اختار المناسبة والتاريخ والميزانية علشان نعرض لك الاختيارات المناسبة.','',1)
          save(p,s,ns)

          # Occasions first eyebrow only.
          p=Path('approved-pages/Dear-Day-Occasions-Approved.html')
          s=p.read_text(encoding='utf-8')
          ns=s.replace('<div class="eyebrow">اختار مناسبتك</div>','',1)
          save(p,s,ns)

          # Gifts breadcrumb + stale state behavior.
          p=Path('approved-pages/Dear-Day-Gifts-Approved.html')
          s=p.read_text(encoding='utf-8')
          ns=s.replace('<div class="container crumbs"><a href="/approved-pages/Dear-Day-Birthday-Approved.html">عيد الميلاد</a> ← <span>تخصيص الهدايا</span></div>','',1)

          old="""const ddStandalone=new URLSearchParams(location.search).get('standalone')==='1';
          let plan=ddStandalone?null:ddReadIncoming();
          if(!plan&&!ddStandalone){try{ plan=JSON.parse(localStorage.getItem('dearDayPlan')||'null') }catch(e){}}
          if(!plan) plan={occasion:'birthday',services:['هدايا'],products:[{name:'صندوق هدايا مخصص',img:'/approved-pages/assets/media/custom-gift-box.jpg',vendor:'The Gift Studio',price:'EGP 1,200'}],giftSelections:[]};"""
          new="""const ddParams=new URLSearchParams(location.search);
          const ddStandalone=ddParams.get('standalone')==='1';
          const ddFlow=ddParams.get('flow')==='1';
          let plan=ddReadIncoming();
          if(!plan&&ddFlow&&!ddStandalone){try{ plan=JSON.parse(localStorage.getItem('dearDayPlan')||'null') }catch(e){}}
          if(!plan) plan={occasion:null,services:['هدايا'],products:[],giftSelections:[]};"""
          if old not in ns:
              raise SystemExit('Gift plan initialization block not found; aborting')
          ns=ns.replace(old,new,1)
          ns=ns.replace('اختيارك السابق محفوظ. استخدم الفلاتر لو عايز تغيّره، أو أضف هدية ثانية تكمل اليوم — من غير ما تبدأ من الصفر.','استخدم الفلاتر واختار الهدية المناسبة، وتقدر تضيف أكتر من اختيار لو حابب.',1)
          ns=ns.replace('أي هدية اخترتها في الخطوة السابقة هتظهر هنا تلقائيًا.','الهدايا اللي تختارها هتظهر هنا علشان تراجعها أو تغيّرها بسهولة.',1)
          save(p,s,ns)

          print('UPDATED_FILES')
          print('\n'.join(changed))
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html Dear-Day-Auth.html approved-pages/*.html
          git commit -m 'Clean requested page copy and gift state'
          git push
