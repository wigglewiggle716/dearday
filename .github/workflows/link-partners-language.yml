name: Link partners language pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-partners-language.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Arabic Partners to English
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('approved-pages/Dear-Day-Partners.html')
          s=p.read_text(encoding='utf-8')
          canonical='<link rel="canonical" href="https://deardayy.vercel.app/approved-pages/Dear-Day-Partners.html"/>'
          alternates=canonical+'\n<link rel="alternate" hreflang="ar" href="https://deardayy.vercel.app/approved-pages/Dear-Day-Partners.html">\n<link rel="alternate" hreflang="en" href="https://deardayy.vercel.app/approved-pages/Dear-Day-Partners-en.html">'
          if 'Dear-Day-Partners-en.html' not in s:
              s=s.replace(canonical,alternates,1)
          old='<div class="auth-actions"><a href="/Dear-Day-Auth.html#login">تسجيل الدخول</a><a href="/Dear-Day-Auth.html#signup">إنشاء حساب</a></div>'
          new='<div class="auth-actions"><a href="/Dear-Day-Auth.html#login">تسجيل الدخول</a><a href="/Dear-Day-Auth.html#signup">إنشاء حساب</a><a aria-label="English" class="lang-link" href="/approved-pages/Dear-Day-Partners-en.html">EN</a></div>'
          if old in s:
              s=s.replace(old,new,1)
          elif 'Dear-Day-Partners-en.html' not in s:
              raise SystemExit('Arabic Partners header marker not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add approved-pages/Dear-Day-Partners.html
          git commit -m "Link Arabic Partners page to English" || exit 0
          git push
