name: How It Works step kicker cleanup
on:
  push:
    paths:
      - '.github/workflows/how-it-works-remove-step-kickers.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove step kickers from AR and EN How It Works
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          paths = [
              Path('how-it-works.html'),
              Path('how-it-works-en.html'),
              Path('approved-pages/Dear-Day-How-It-Works.html'),
              Path('approved-pages/Dear-Day-How-It-Works-en.html'),
          ]
          for p in paths:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s2, n = re.subn(r'<span class="step-kicker">.*?</span>', '', s)
              if n:
                  p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/how-it-works-remove-step-kickers.yml
          git config user.name 'Dear Day Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add how-it-works.html how-it-works-en.html approved-pages/Dear-Day-How-It-Works.html approved-pages/Dear-Day-How-It-Works-en.html .github/workflows/how-it-works-remove-step-kickers.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Remove step kickers from How It Works'
          git push origin main
