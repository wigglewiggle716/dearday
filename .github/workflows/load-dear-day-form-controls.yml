name: Load Dear Day form controls
on:
  push:
    paths:
      - '.github/workflows/load-dear-day-form-controls.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Load shared branded form controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('approved-pages/dear-day-cart.js')
          s=p.read_text(encoding='utf-8')
          anchor="  const KEY='dearDayCart';\n"
          block="  const KEY='dearDayCart';\n\n  function ensureBrandedFormControls(){\n    if(!document.querySelector('link[data-dd-form-controls]')){\n      const l=document.createElement('link');\n      l.rel='stylesheet';\n      l.href='/approved-pages/assets/dear-day-form-controls.css?v=20261003-1';\n      l.setAttribute('data-dd-form-controls','');\n      (document.head||document.documentElement).appendChild(l);\n    }\n    if(!document.querySelector('script[data-dd-form-controls]')){\n      const s=document.createElement('script');\n      s.src='/approved-pages/dear-day-form-controls.js?v=20261003-1';\n      s.defer=true;\n      s.setAttribute('data-dd-form-controls','');\n      (document.head||document.documentElement).appendChild(s);\n    }\n  }\n  ensureBrandedFormControls();\n"
          if 'data-dd-form-controls' not in s:
              if anchor not in s:
                  raise SystemExit('anchor missing')
              s=s.replace(anchor,block,1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add approved-pages/dear-day-cart.js
          git diff --cached --quiet || git commit -m "Load Dear Day branded form controls"
          git push
