name: Venues hero layout cleanup
on:
  push:
    paths:
      - '.github/workflows/venues-hero-layout-cleanup.yml'
permissions:
  contents: write
jobs:
  update-venues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update venues hero and remove current-selection panel
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              (Path('venues.html'), 'rtl'),
              (Path('venues-en.html'), 'ltr'),
              (Path('approved-pages/Dear-Day-Venues-Approved.html'), 'rtl'),
              (Path('approved-pages/Dear-Day-Venues-Approved-en.html'), 'ltr'),
          ]

          for p, direction in files:
              s = p.read_text(encoding='utf-8')

              # Desktop hero: image on the left, copy on the right in both languages.
              s = re.sub(r'\.hero\{(?![^}]*direction:)', '.hero{direction:ltr;', s, count=1)
              s = re.sub(
                  r'\.hero-copy\{(?![^}]*direction:)',
                  f'.hero-copy{{direction:{direction};',
                  s,
                  count=1,
              )

              # Remove the small hero label/pill only.
              s = re.sub(
                  r'(<div class="hero-copy">)\s*<span class="pill">.*?</span>',
                  r'\1',
                  s,
                  count=1,
                  flags=re.S,
              )

              # Remove now-unused top spacing above the hero title.
              s = re.sub(
                  r'(\.hero h1\{[^}]*?)margin:20px 0 12px;',
                  r'\1margin:0 0 12px;',
                  s,
                  count=1,
              )

              # Remove the whole current-selection panel. English has an extra paragraph,
              # so target the stable wrapper/currentWrap structure instead of heading text.
              s = re.sub(
                  r'<div class="current">.*?<div id="currentWrap"></div>\s*</div>',
                  '',
                  s,
                  count=1,
                  flags=re.S,
              )

              # Selection state still powers cards/cart. Keep the old renderer harmless
              # when its intentionally removed visual container is absent.
              guard = "function renderCurrent(){const wrap=el('currentWrap');if(!wrap)return;"
              if guard not in s:
                  s = s.replace('function renderCurrent(){', guard, 1)

              checks = {
                  'current selection panel': '<div id="currentWrap"></div>' not in s,
                  'hero pill': '<div class="hero-copy"><span class="pill">' not in s,
                  'hero direction': '.hero{direction:ltr;' in s,
                  'safe renderer': guard in s,
              }
              failed = [name for name, ok in checks.items() if not ok]
              if failed:
                  raise RuntimeError(f'{p}: failed checks: {", ".join(failed)}')

              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "Dear Day Automation"
          git config user.email "actions@users.noreply.github.com"
          git add venues.html venues-en.html approved-pages/Dear-Day-Venues-Approved.html approved-pages/Dear-Day-Venues-Approved-en.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refine venues hero layout"
          git push
