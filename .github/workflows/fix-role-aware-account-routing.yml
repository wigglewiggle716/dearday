name: Fix role-aware account routing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-role-aware-account-routing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch role-aware routing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          STAFF_ROLES = "['super_admin','admin','operations','accountant','partner_manager','customer_support','marketing','content_admin']"

          auth = Path('approved-pages/dear-day-auth-state.js')
          s = auth.read_text()
          anchor = "  const text=(ar,en)=>isEn()?en:ar;\n"
          insert = anchor + "  const STAFF_ROLES=new Set(" + STAFF_ROLES + ");\n  const ADMIN_ROLES=new Set(['super_admin','admin']);\n  function portalPath(role){if(ADMIN_ROLES.has(role))return'/Dear-Day-Admin.html';if(role==='partner_user')return'/Dear-Day-Partner.html';if(STAFF_ROLES.has(role))return'/Dear-Day-Staff.html';return accountPath()}\n  function secondaryPath(role){if(role==='partner_user')return'/Dear-Day-Partner-Orders.html';if(STAFF_ROLES.has(role))return'/Dear-Day-Notifications.html';return bookingsPath()}\n  function mainLabel(role){if(ADMIN_ROLES.has(role))return text('لوحة الإدارة','Admin Dashboard');if(role==='partner_user')return text('بوابة الشريك','Partner Portal');if(STAFF_ROLES.has(role))return text('بوابة الفريق','Staff Portal');return text('حسابي','My Account')}\n  function secondaryLabel(role){if(role==='partner_user')return text('طلبات الشريك','Partner Orders');if(STAFF_ROLES.has(role))return text('الإشعارات','Notifications');return text('حجوزاتي','My Bookings')}\n"
          if anchor not in s: raise SystemExit('auth anchor missing')
          s = s.replace(anchor, insert, 1)
          s = s.replace("function maybeRedirectToProfile(user){if(!user||profileComplete(user))return false;", "function maybeRedirectToProfile(user,role){if(!user||role!=='customer'||profileComplete(user))return false;", 1)
          s = s.replace("function mountAccountMenu(user,signOut){", "function mountAccountMenu(user,signOut,role){", 1)
          old_links = "wrap.querySelector('.dd-account-head strong').textContent=d.label;wrap.querySelector('.dd-account-head span').textContent=d.email;const a1=wrap.querySelector('.dd-go-account'),a2=wrap.querySelector('.dd-go-bookings'),lo=wrap.querySelector('.dd-menu-logout');a1.href=accountPath();a1.textContent=text('حسابي','My Account');a2.href=bookingsPath();a2.textContent=text('حجوزاتي','My Bookings');lo.textContent=text('تسجيل الخروج','Log out')"
          new_links = "wrap.querySelector('.dd-account-head strong').textContent=d.label;wrap.querySelector('.dd-account-head span').textContent=d.email;const a1=wrap.querySelector('.dd-go-account'),a2=wrap.querySelector('.dd-go-bookings'),lo=wrap.querySelector('.dd-menu-logout');a1.href=portalPath(role);a1.textContent=mainLabel(role);a2.href=secondaryPath(role);a2.textContent=secondaryLabel(role);lo.textContent=text('تسجيل الخروج','Log out')"
          if old_links not in s: raise SystemExit('auth menu links target missing')
          s = s.replace(old_links, new_links, 1)
          s = s.replace("let currentUser=null;const signOut=", "let currentUser=null,currentRole='customer';const signOut=", 1)
          s = s.replace("const paint=()=>{mountAccountMenu(currentUser,signOut);", "const paint=()=>{mountAccountMenu(currentUser,signOut,currentRole);", 1)
          old_boot = "try{const {data}=await supabase.auth.getUser();currentUser=data?.user||null}catch(e){currentUser=null}if(maybeRedirectToProfile(currentUser))return;paint();supabase.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;if(maybeRedirectToProfile(currentUser))return;paint()});"
          new_boot = "try{const {data}=await supabase.auth.getUser();currentUser=data?.user||null}catch(e){currentUser=null}if(currentUser){const {data:p}=await supabase.from('profiles').select('role,is_active').eq('id',currentUser.id).maybeSingle();if(p?.is_active===false){await signOut();return}currentRole=p?.role||'customer'}if(maybeRedirectToProfile(currentUser,currentRole))return;paint();supabase.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;currentRole='customer';if(currentUser){const {data:p}=await supabase.from('profiles').select('role,is_active').eq('id',currentUser.id).maybeSingle();if(p?.is_active===false){await signOut();return}currentRole=p?.role||'customer'}if(maybeRedirectToProfile(currentUser,currentRole))return;paint()});"
          if old_boot not in s: raise SystemExit('auth boot target missing')
          s = s.replace(old_boot, new_boot, 1)
          auth.write_text(s)

          # Shared non-customer redirect helper for customer-only pages.
          def add_guard(path, marker, user_var, before):
              p=Path(path); x=p.read_text()
              helper="\n  const STAFF_ROLES=new Set("+STAFF_ROLES+");\n  function portalForRole(role){if(role==='super_admin'||role==='admin')return'/Dear-Day-Admin.html';if(role==='partner_user')return'/Dear-Day-Partner.html';if(STAFF_ROLES.has(role))return'/Dear-Day-Staff.html';return null}\n"
              if 'function portalForRole(role)' not in x:
                  x=x.replace(marker, marker+helper, 1)
              guard="const {data:ddAccess}=await supabase.from('profiles').select('role,is_active').eq('id',"+user_var+".id).maybeSingle();if(ddAccess?.is_active===false){await supabase.auth.signOut();location.replace(authPath()+'#login');return}const ddPortal=portalForRole(ddAccess?.role);if(ddPortal){location.replace(ddPortal);return}"
              if before not in x: raise SystemExit(path+' guard target missing')
              x=x.replace(before, guard+before, 1)
              p.write_text(x)

          add_guard('approved-pages/dear-day-account.js', "  const home=()=>en()?'/index-en.html':'/';\n", 'user', "\n    await ensureProfile();fill();await loadAddresses();")
          add_guard('approved-pages/dear-day-bookings.js', "  const occasionPath=()=>en()?'/approved-pages/Dear-Day-Occasions-Approved-en.html':'/approved-pages/Dear-Day-Occasions-Approved.html';\n", 'userData.user', "await loadData()}")
          add_guard('approved-pages/dear-day-complete-profile.js', "  const text=(ar,en)=>isEn()?en:ar;\n", 'user', "\n    const user=data.user,meta=user.user_metadata||{},name=splitName(meta);")

          # Bump runtime cache versions.
          nav=Path('approved-pages/dear-day-mobile-nav.js'); n=nav.read_text(); n=re.sub(r'dear-day-auth-state\.js\?v=[^\'\"]+', 'dear-day-auth-state.js?v=20261003-6', n); nav.write_text(n)
          cart=Path('approved-pages/dear-day-cart.js'); c=cart.read_text(); c=re.sub(r'dear-day-mobile-nav\.js\?v=[^\'\"]+', 'dear-day-mobile-nav.js?v=20261003-6', c); cart.write_text(c)

          for f in ['index.html','index-en.html','Dear-Day-Account.html','Dear-Day-Account-en.html','Dear-Day-Bookings.html','Dear-Day-Bookings-en.html']:
              p=Path(f); h=p.read_text(); h=re.sub(r'dear-day-cart\.js\?v=[^\'\"<]+','dear-day-cart.js?v=20261003-6',h); p.write_text(h)
          for f in ['Dear-Day-Account.html','Dear-Day-Account-en.html']:
              p=Path(f); h=p.read_text(); h=re.sub(r'dear-day-account\.js\?v=[^\'\"<]+','dear-day-account.js?v=20261003-6',h); p.write_text(h)
          for f in ['Dear-Day-Bookings.html','Dear-Day-Bookings-en.html']:
              p=Path(f); h=p.read_text(); h=re.sub(r'dear-day-bookings\.js\?v=[^\'\"<]+','dear-day-bookings.js?v=20261003-6',h); p.write_text(h)
          for f in ['Dear-Day-Complete-Profile.html','Dear-Day-Complete-Profile-en.html']:
              p=Path(f); h=p.read_text(); h=re.sub(r'dear-day-complete-profile\.js\?v=[^\'\"<]+','dear-day-complete-profile.js?v=20261003-6',h); p.write_text(h)
          PY
          git rm .github/workflows/fix-role-aware-account-routing.yml
      - name: Commit role routing fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix role-aware account and portal routing'
          git push
