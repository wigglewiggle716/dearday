name: Fix cart persistence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cart-persistence.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make cart state persist globally
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Make dearDayPlan the persistent source of truth for the global cart.
          p=Path('approved-pages/dear-day-cart.js')
          s=p.read_text(encoding='utf-8')
          pattern=r"  function importPlan\(plan\)\{.*?\n  \}\n  window\.DDCart="
          lines=[
            "  function importPlan(plan){",
            "    if(!plan||typeof plan!=='object')return read();",
            "    const types=[['gift','giftSelections'],['cake','cakeSelections'],['venue','venueSelections']];",
            "    const hasSelectionState=types.some(([,key])=>Array.isArray(plan[key]))||Array.isArray(plan.products);",
            "    if(!hasSelectionState)return read();",
            "    let a=[];",
            "    types.forEach(([type,key])=>{",
            "      const items=Array.isArray(plan[key])?plan[key]:[];",
            "      a=a.concat(items.filter(Boolean).map(x=>normalize(type,x,plan)));",
            "    });",
            "    const extras=Array.isArray(plan.products)?plan.products:[];",
            "    extras.forEach(item=>{",
            "      if(!item)return;",
            "      const type=inferPlanProductType(item);",
            "      const n=normalize(type,item,plan);",
            "      const nName=String(n.name||n.ar||'').trim().toLowerCase();",
            "      const exists=a.some(x=>x.key===n.key||(x.type===n.type&&String(x.name||x.ar||'').trim().toLowerCase()===nName));",
            "      if(!exists)a.push(n);",
            "    });",
            "    return write(a);",
            "  }",
            "  window.DDCart="
          ]
          replacement='\n'.join(lines)
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'importPlan replacement count={n}')
          s=s2
          old="""  function boot(){
    normalizeGlobalHeader();
    bindMobileDatePickers();
    normalizePaymentLogos();
    initSignatureExperience();
    removeHeaderCart();
    paint();"""
          new="""  function boot(){
    normalizeGlobalHeader();
    bindMobileDatePickers();
    normalizePaymentLogos();
    initSignatureExperience();
    importPlan(readPlanData());
    removeHeaderCart();
    paint();"""
          if old not in s:
              raise SystemExit('boot marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 2) Ensure deleting/clearing in My Cart also updates the saved plan,
          # so removed items do not come back on the next page load.
          p=Path('approved-pages/Dear-Day-Cart.html')
          s=p.read_text(encoding='utf-8')
          old="""function syncPlanRemoval(item){
  const map={gift:'giftSelections',cake:'cakeSelections',venue:'venueSelections'};
  const k=map[item.type]; if(!k)return;
  plan[k]=(Array.isArray(plan[k])?plan[k]:[]).filter(x=>String(x.id||x.name||x.ar)!==String(item.id));
  savePlan(plan);
}"""
          new="""function syncPlanRemoval(item){
  const map={gift:'giftSelections',cake:'cakeSelections',venue:'venueSelections'};
  const k=map[item.type];
  const same=x=>String(x?.id||x?.name||x?.ar||'')===String(item.id||item.name||item.ar||'')||String(x?.name||x?.ar||'')===String(item.name||item.ar||'');
  if(k)plan[k]=(Array.isArray(plan[k])?plan[k]:[]).filter(x=>!same(x));
  plan.products=(Array.isArray(plan.products)?plan.products:[]).filter(x=>!same(x));
  plan.packageSelections=(Array.isArray(plan.packageSelections)?plan.packageSelections:[]).filter(x=>!same(x));
  if(plan.recommendedPackage&&Array.isArray(plan.recommendedPackage.items)&&plan.recommendedPackage.items.some(same))plan.recommendedPackage=null;
  savePlan(plan);
}"""
          if old not in s:
              raise SystemExit('syncPlanRemoval marker not found')
          s=s.replace(old,new,1)
          old="""document.getElementById('clearCart').onclick=()=>{
  if(!window.DDCart)return;
  plan.giftSelections=[];plan.cakeSelections=[];plan.venueSelections=[];savePlan(plan);DDCart.clear();render();
};"""
          new="""document.getElementById('clearCart').onclick=()=>{
  if(!window.DDCart)return;
  plan.giftSelections=[];
  plan.cakeSelections=[];
  plan.venueSelections=[];
  plan.products=[];
  plan.packageSelections=[];
  plan.recommendedPackage=null;
  savePlan(plan);
  DDCart.clear();
  render();
};"""
          if old not in s:
              raise SystemExit('clearCart marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add approved-pages/dear-day-cart.js approved-pages/Dear-Day-Cart.html
          git commit -m "Persist cart count across all pages"
          git push
