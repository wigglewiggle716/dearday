name: Fix cart persistence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cart-persistence.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch persistent cart
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add approved-pages/dear-day-cart.js approved-pages/Dear-Day-Cart.html
          git commit -m "Persist cart count across all pages"
          git push
