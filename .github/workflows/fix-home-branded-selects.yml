name: Fix home branded selects

on:
  push:
    paths:
      - '.github/workflows/fix-home-branded-selects.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped home select fix
        run: |
          python scripts/fix_home_branded_selects.py
          node --check approved-pages/dear-day-cart.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add approved-pages/dear-day-cart.js index.html index-en.html
          git commit -m "Restore branded home planner selects safely" || exit 0
          git push origin HEAD:main
