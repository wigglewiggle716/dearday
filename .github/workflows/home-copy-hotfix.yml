name: Home copy hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-copy-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Arabic and English home hero copy
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': [
                  ('<div class="hero-kicker">منصة واحدة لتنظيم مناسبتك من البداية للنهاية</div>', ''),
                  ('المكان والتجربة، الهدية، الكيك والحلويات، وتفاصيل اليوم', 'المكان والتجربة، الهدية، الكيك والحلويات، والورد'),
              ],
              'index-en.html': [
                  ('<div class="hero-kicker">One place to plan the whole occasion, start to finish</div>', ''),
                  ('venue or experience, gift, cake and sweets, flowers, and day details', 'venue or experience, gift, cake and sweets, and flowers'),
              ],
          }

          changed = False
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      print(f'Pattern already absent or changed in {filename}: {old}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed = True
                  print(f'Updated {filename}')

          if not changed:
              print('No changes needed.')
          PY

      - name: Commit home copy changes
        run: |
          if git diff --quiet -- index.html index-en.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Dear Day Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html index-en.html
          git commit -m "Refine home hero copy in Arabic and English"
          git push origin HEAD:main
