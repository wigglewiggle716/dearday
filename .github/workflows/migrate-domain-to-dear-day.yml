name: Migrate production domain to dear-day.com

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-domain-to-dear-day.yml

permissions:
  contents: write

jobs:
  migrate-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old Vercel domain references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = b"deardayy.vercel.app"
          new = b"dear-day.com"
          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed = []

          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if old not in data:
                  continue
              updated = data.replace(old, new)
              path.write_bytes(updated)
              changed.append(str(path))

          print(f"Updated {len(changed)} file(s):")
          for item in changed:
              print(f"- {item}")

          if any(old in Path(f.decode('utf-8')).read_bytes() for f in files if f and Path(f.decode('utf-8')).is_file()):
              raise SystemExit("Old domain reference still exists after migration")
          PY

      - name: Commit migrated URLs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No old-domain references found; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Migrate site URLs to dear-day.com"
          git push
