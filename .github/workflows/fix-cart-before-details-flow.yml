name: Fix cart before details flow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cart-before-details-flow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix occasion flow and details total
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Gifts: if there is no later service, go to Cart instead of Details.
          p=Path('approved-pages/Dear-Day-Gifts-Approved.html')
          s=p.read_text(encoding='utf-8')
          old="giftNextBtn.textContent=needCake?'التالي: الكيك والحلويات ←':needVenue?'التالي: الأماكن والتجارب ←':'التالي: تفاصيل المناسبة ←';return {needCake,needVenue}"
          new="giftNextBtn.textContent=needCake?'التالي: الكيك والحلويات ←':needVenue?'التالي: الأماكن والتجارب ←':'التالي: My Cart ←';return {needCake,needVenue}"
          if old not in s: raise SystemExit('gift next-state marker not found')
          s=s.replace(old,new,1)
          old="if(needVenue){ddGo('/approved-pages/Dear-Day-Venues-Approved.html',plan);return}ddGo('/approved-pages/Dear-Day-Details-Approved.html',plan);};"
          new="if(needVenue){ddGo('/approved-pages/Dear-Day-Venues-Approved.html',plan);return}ddGo('/approved-pages/Dear-Day-Cart.html',plan);};"
          if old not in s: raise SystemExit('gift final target marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Cake: if there is no venue service, go to Cart instead of Details.
          p=Path('approved-pages/Dear-Day-Cake-Approved.html')
          s=p.read_text(encoding='utf-8')
          old="el('nextBtn').textContent=needVenue?'التالي: الأماكن والتجارب ←':'التالي: تفاصيل المناسبة ←';return needVenue}"
          new="el('nextBtn').textContent=needVenue?'التالي: الأماكن والتجارب ←':'التالي: My Cart ←';return needVenue}"
          if old not in s: raise SystemExit('cake next-state marker not found')
          s=s.replace(old,new,1)
          old="if(cakeNextState()){ddGo('/approved-pages/Dear-Day-Venues-Approved.html',plan);return}ddGo('/approved-pages/Dear-Day-Details-Approved.html',plan)};"
          new="if(cakeNextState()){ddGo('/approved-pages/Dear-Day-Venues-Approved.html',plan);return}ddGo('/approved-pages/Dear-Day-Cart.html',plan)};"
          if old not in s: raise SystemExit('cake final target marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Venues: always go to Cart after the venue/experience selection.
          p=Path('approved-pages/Dear-Day-Venues-Approved.html')
          s=p.read_text(encoding='utf-8')
          old="el('nextBtn').onclick=()=>{persist();ddGo('/approved-pages/Dear-Day-Details-Approved.html',plan)};"
          new="el('nextBtn').onclick=()=>{persist();ddGo('/approved-pages/Dear-Day-Cart.html',plan)};"
          if old not in s: raise SystemExit('venue final target marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Details: rebuild/sync cart from the saved plan before rendering mini items and total.
          p=Path('approved-pages/Dear-Day-Details-Approved.html')
          s=p.read_text(encoding='utf-8')
          old="const plan=readPlan();\nconst prev=plan.eventDetails||{};"
          new="const plan=readPlan();\nif(window.DDCart)DDCart.importPlan(plan);\nconst prev=plan.eventDetails||{};"
          if old not in s: raise SystemExit('details plan marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add approved-pages/Dear-Day-Gifts-Approved.html approved-pages/Dear-Day-Cake-Approved.html approved-pages/Dear-Day-Venues-Approved.html approved-pages/Dear-Day-Details-Approved.html
          git commit -m "Put cart before occasion details and sync totals"
          git push
