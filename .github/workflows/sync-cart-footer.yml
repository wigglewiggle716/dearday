name: Sync cart footer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-cart-footer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync My Cart footer and remove note
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cart=Path('approved-pages/Dear-Day-Cart.html')
          faq=Path('approved-pages/Dear-Day-FAQ.html')
          s=cart.read_text(encoding='utf-8')
          f=faq.read_text(encoding='utf-8')

          # Remove the temporary pricing note below cart summary.
          s=s.replace('<p class="note">الأسعار المعروضة تجريبية حاليًا وقد تتغير عند ربط الموردين والدفع الفعلي.</p>','',1)

          # Replace the old compact cart footer styles with the approved full footer styles.
          old_css="footer{background:#5D0C1D;color:#fff;padding:42px clamp(24px,7vw,110px);margin-top:30px}.footer-inner{max-width:1180px;margin:auto;display:flex;justify-content:space-between;gap:30px;align-items:center}.footer-inner img{width:155px;filter:brightness(0) invert(1)}.footer-inner small{color:#e7c9cf}"
          new_css=".dd-occ-footer{background:#5D0C1D;color:#f8e8eb;padding:52px 0 24px;margin-top:30px}.dd-occ-footer .wrap{width:min(1120px,calc(100% - 40px));margin:auto}.footer-top{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:40px}.footer-logo img{width:170px;filter:brightness(0) invert(1)}.footer-top h4{margin:0 0 16px;color:white}.footer-top a{display:block;color:#efd9de;margin:10px 0;font-size:14px}.footer-note{color:#efd9de;line-height:1.8;font-size:14px;max-width:330px}.footer-bottom{border-top:1px solid rgba(255,255,255,.25);margin-top:34px;padding-top:20px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:#dcc2c8;font-size:13px}.payments{display:flex;gap:8px;flex-wrap:wrap}.pay{background:white;color:#6B3540;padding:7px 11px;border-radius:7px;font-weight:800;font-size:11px}"
          if old_css not in s:
              raise SystemExit('old cart footer CSS not found')
          s=s.replace(old_css,new_css,1)
          s=s.replace('.footer-inner{flex-direction:column;align-items:flex-start}', '.footer-top{grid-template-columns:1fr}.footer-bottom{flex-direction:column}', 1)
          s=s.replace('@media(max-width:900px){.home-nav{display:none}.cart-layout{grid-template-columns:1fr}', '@media(max-width:900px){.home-nav{display:none}.footer-top{grid-template-columns:repeat(2,1fr)}.cart-layout{grid-template-columns:1fr}', 1)

          # Reuse the current approved footer markup from FAQ so links stay consistent.
          m=re.search(r'<footer class="dd-occ-footer">.*?</footer>', f, flags=re.S)
          if not m:
              raise SystemExit('approved FAQ footer not found')
          approved_footer=m.group(0)
          s2,n=re.subn(r'<footer><div class="footer-inner">.*?</footer>', approved_footer, s, count=1, flags=re.S)
          if n!=1:
              raise SystemExit(f'cart footer replacement count={n}')

          cart.write_text(s2,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add approved-pages/Dear-Day-Cart.html
          git commit -m "Sync My Cart footer with approved site footer"
          git push
