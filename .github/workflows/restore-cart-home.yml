name: Restore Cart On Arabic Home
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-cart-home.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore global cart script on Arabic home
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '/approved-pages/dear-day-cart.js' not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('body closing tag not found')
              s=s.replace(marker,'<script src="/approved-pages/dear-day-cart.js?v=20260930-2"></script>\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add index.html
          git commit -m "Restore floating cart on Arabic home" || exit 0
          git push
