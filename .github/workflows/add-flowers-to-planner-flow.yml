name: Add flowers to planner flow
on:
  push:
    paths:
      - '.github/workflows/add-flowers-to-planner-flow.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch planner and category routing
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(path, old, new, count=1):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n < count:
                  raise SystemExit(f'{path}: expected at least {count} matches, found {n} for {old[:100]!r}')
              s=s.replace(old,new,count)
              p.write_text(s,encoding='utf-8')

          # Arabic planner: 4 service cards + flower routing.
          p=Path('approved-pages/Dear-Day-Birthday-Approved.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('راجع الميزانية واختار الهدايا والكيك والأماكن والتجارب المناسبة','راجع الميزانية واختار الهدايا والكيك والورد والأماكن والتجارب المناسبة',1)
          s=s.replace('.services{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}', '.services{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}',1)
          venue_marker='<article class="service" data-img="/approved-pages/assets/media/venue-service.jpg" data-service="أماكن وتجارب" tabindex="0">'
          flower_card='''<article class="service" data-img="/approved-pages/assets/media/flowers-bouquet.jpg" data-service="ورد" tabindex="0">\n<span class="check">✓</span><div class="icon">🌷</div><div><h3>ورد</h3><p>بوكيهات وتنسيقات ورد تناسب المناسبة والذوق</p></div><img alt="ورد" src="/approved-pages/assets/media/flowers-bouquet.jpg"/>\n</article>\n'''
          if 'data-service="ورد"' not in s:
              if venue_marker not in s: raise SystemExit('Arabic planner venue marker missing')
              s=s.replace(venue_marker,flower_card+venue_marker,1)
          s=s.replace("const hasCake=packageMode||plan.services.some(s=>/كيك|حلويات/.test(s))||plan.products.some(p=>/كيك|تورت|حلويات|cake/i.test(p.name||''));\n  const hasVenue=", "const hasCake=packageMode||plan.services.some(s=>/كيك|حلويات/.test(s))||plan.products.some(p=>/كيك|تورت|حلويات|cake/i.test(p.name||''));\n  const hasFlowers=packageMode||plan.services.some(s=>/ورد|زهور/.test(s));\n  const hasVenue=",1)
          s=s.replace("if(hasCake){ddGo('/approved-pages/Dear-Day-Cake-Approved.html',plan);return}\n  if(hasVenue)", "if(hasCake){ddGo('/approved-pages/Dear-Day-Cake-Approved.html',plan);return}\n  if(hasFlowers){ddGo('/approved-pages/Dear-Day-Flowers-Approved.html',plan);return}\n  if(hasVenue)",1)
          s=s.replace("const serviceMap={gift:'هدايا',cake:'كيك وحلويات',venue:'أماكن وتجارب'};", "const serviceMap={gift:'هدايا',cake:'كيك وحلويات',flower:'ورد',venue:'أماكن وتجارب'};",1)
          p.write_text(s,encoding='utf-8')

          # English planner.
          p=Path('approved-pages/Dear-Day-Birthday-Approved-en.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('continue through gifts, cake, places and experiences','continue through gifts, cake, flowers, places and experiences',1)
          s=s.replace('.services{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}', '.services{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}',1)
          en_venue='<article class="service" data-service="venues"><span class="check">✓</span><div class="icon">📍</div><h3>Places & Experiences</h3>'
          en_flower='''<article class="service" data-service="flowers"><span class="check">✓</span><div class="icon">🌷</div><h3>Flowers</h3><p>Bouquets and flower arrangements chosen to fit the occasion.</p><img src="/approved-pages/assets/media/flowers-bouquet.jpg" alt="Flower selection"></article>'''
          if 'data-service="flowers"' not in s:
              if en_venue not in s: raise SystemExit('English planner venue marker missing')
              s=s.replace(en_venue,en_flower+en_venue,1)
          s=s.replace('Include Gifts + Cake & Sweets + Places & Experiences in one plan.','Include Gifts + Cake & Sweets + Flowers + Places & Experiences in one plan.',1)
          s=s.replace("selected.add('gifts');selected.add('cake');selected.add('venues')", "selected.add('gifts');selected.add('cake');selected.add('flowers');selected.add('venues')",1)
          s=s.replace("if(selected.has('cake')){location.href='/approved-pages/Dear-Day-Cake-Approved-en.html'+q;return}if(selected.has('venues'))", "if(selected.has('cake')){location.href='/approved-pages/Dear-Day-Cake-Approved-en.html'+q;return}if(selected.has('flowers')){location.href='/approved-pages/Dear-Day-Flowers-Approved-en.html'+q;return}if(selected.has('venues'))",1)
          p.write_text(s,encoding='utf-8')

          # Arabic Gifts -> Cake -> Flowers -> Venues -> Cart.
          p=Path('approved-pages/Dear-Day-Gifts-Approved.html')
          s=p.read_text(encoding='utf-8')
          old="function giftNextState(){const services=plan.services||[];const packageMode=services.some(s=>/باقة متكاملة/.test(s));const needCake=packageMode||services.some(s=>/كيك|حلويات/.test(s));const needVenue=packageMode||services.some(s=>/أماكن|تجارب/.test(s));giftNextBtn.textContent=needCake?'التالي: الكيك والحلويات ←':needVenue?'التالي: الأماكن والتجارب ←':'التالي: My Cart ←';return {needCake,needVenue}}\ngiftNextBtn.onclick=()=>{persist();if(!selected.size){showToast('اختار هدية واحدة على الأقل علشان نكمل');document.getElementById('productGrid')?.scrollIntoView({behavior:'smooth',block:'start'});return}const {needCake,needVenue}=giftNextState();if(needCake){ddGo('/approved-pages/Dear-Day-Cake-Approved.html',plan);return}if(needVenue){ddGo('/approved-pages/Dear-Day-Venues-Approved.html',plan);return}ddGo('/approved-pages/Dear-Day-Cart.html',plan);};"
          new="function giftNextState(){const services=plan.services||[];const packageMode=services.some(s=>/باقة متكاملة/.test(s));const needCake=packageMode||services.some(s=>/كيك|حلويات/.test(s));const needFlowers=packageMode||services.some(s=>/ورد|زهور/.test(s));const needVenue=packageMode||services.some(s=>/أماكن|تجارب/.test(s));giftNextBtn.textContent=needCake?'التالي: الكيك والحلويات ←':needFlowers?'التالي: الورد ←':needVenue?'التالي: الأماكن والتجارب ←':'التالي: My Cart ←';return {needCake,needFlowers,needVenue}}\ngiftNextBtn.onclick=()=>{persist();if(!selected.size){showToast('اختار هدية واحدة على الأقل علشان نكمل');document.getElementById('productGrid')?.scrollIntoView({behavior:'smooth',block:'start'});return}const {needCake,needFlowers,needVenue}=giftNextState();if(needCake){ddGo('/approved-pages/Dear-Day-Cake-Approved.html',plan);return}if(needFlowers){ddGo('/approved-pages/Dear-Day-Flowers-Approved.html',plan);return}if(needVenue){ddGo('/approved-pages/Dear-Day-Venues-Approved.html',plan);return}ddGo('/approved-pages/Dear-Day-Cart.html',plan);};"
          if old not in s: raise SystemExit('Arabic gifts routing block missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Arabic Cake -> Flowers -> Venues -> Cart.
          p=Path('approved-pages/Dear-Day-Cake-Approved.html')
          s=p.read_text(encoding='utf-8')
          old="function cakeNextState(){const services=plan.services||[];const needVenue=services.some(s=>/باقة متكاملة|أماكن|تجارب/.test(s));el('nextBtn').textContent=needVenue?'التالي: الأماكن والتجارب ←':'التالي: My Cart ←';return needVenue}\nel('nextBtn').onclick=()=>{persist();if(cakeNextState()){ddGo('/approved-pages/Dear-Day-Venues-Approved.html',plan);return}ddGo('/approved-pages/Dear-Day-Cart.html',plan)};"
          new="function cakeNextState(){const services=plan.services||[];const packageMode=services.some(s=>/باقة متكاملة/.test(s));const needFlowers=packageMode||services.some(s=>/ورد|زهور/.test(s));const needVenue=packageMode||services.some(s=>/أماكن|تجارب/.test(s));el('nextBtn').textContent=needFlowers?'التالي: الورد ←':needVenue?'التالي: الأماكن والتجارب ←':'التالي: My Cart ←';return {needFlowers,needVenue}}\nel('nextBtn').onclick=()=>{persist();const {needFlowers,needVenue}=cakeNextState();if(needFlowers){ddGo('/approved-pages/Dear-Day-Flowers-Approved.html',plan);return}if(needVenue){ddGo('/approved-pages/Dear-Day-Venues-Approved.html',plan);return}ddGo('/approved-pages/Dear-Day-Cart.html',plan)};"
          if old not in s: raise SystemExit('Arabic cake routing block missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # English Gifts routing.
          p=Path('approved-pages/Dear-Day-Gifts-Approved-en.html')
          s=p.read_text(encoding='utf-8')
          old="function giftNextState(){const services=plan.services||[];const packageMode=services.some(s=>/باقة متكاملة|full package|complete package/i.test(s));const needCake=packageMode||services.some(s=>/كيك|حلويات|cake|sweets/i.test(s));const needVenue=packageMode||services.some(s=>/أماكن|تجارب|places|venue|experience/i.test(s));nextBtn.textContent=needCake?'Next: Cake & Sweets →':needVenue?'Next: Places & Experiences →':'Next: My Cart →';return{needCake,needVenue}}\nfunction go(file){persist();const payload=encodeURIComponent(JSON.stringify(compactPlan(plan)));location.href=file+(flow?'?flow=1&':'?')+'dd='+payload}\nnextBtn.onclick=()=>{if(!selected.size){showToast('Choose at least one gift to continue');grid.scrollIntoView({behavior:'smooth',block:'start'});return}const{needCake,needVenue}=giftNextState();if(needCake){go('/approved-pages/Dear-Day-Cake-Approved-en.html');return}if(needVenue){go('/approved-pages/Dear-Day-Venues-Approved.html');return}go('/approved-pages/Dear-Day-Cart.html')};"
          new="function giftNextState(){const services=plan.services||[];const packageMode=services.some(s=>/باقة متكاملة|full package|complete package|package/i.test(s));const needCake=packageMode||services.some(s=>/كيك|حلويات|cake|sweets/i.test(s));const needFlowers=packageMode||services.some(s=>/flowers?|ورد|زهور/i.test(s));const needVenue=packageMode||services.some(s=>/أماكن|تجارب|places|venue|experience/i.test(s));nextBtn.textContent=needCake?'Next: Cake & Sweets →':needFlowers?'Next: Flowers →':needVenue?'Next: Places & Experiences →':'Next: My Cart →';return{needCake,needFlowers,needVenue}}\nfunction go(file){persist();const payload=encodeURIComponent(JSON.stringify(compactPlan(plan)));location.href=file+(flow?'?flow=1&':'?')+'dd='+payload}\nnextBtn.onclick=()=>{if(!selected.size){showToast('Choose at least one gift to continue');grid.scrollIntoView({behavior:'smooth',block:'start'});return}const{needCake,needFlowers,needVenue}=giftNextState();if(needCake){go('/approved-pages/Dear-Day-Cake-Approved-en.html');return}if(needFlowers){go('/approved-pages/Dear-Day-Flowers-Approved-en.html');return}if(needVenue){go('/approved-pages/Dear-Day-Venues-Approved-en.html');return}go('/approved-pages/Dear-Day-Cart-en.html')};"
          if old not in s: raise SystemExit('English gifts routing block missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # English Cake routing.
          p=Path('approved-pages/Dear-Day-Cake-Approved-en.html')
          s=p.read_text(encoding='utf-8')
          old="function nextState(){const services=plan.services||[];const needVenue=services.some(s=>/باقة متكاملة|أماكن|تجارب|places|venues|experiences/i.test(s));el('nextBtn').textContent=needVenue?'Next: Places & Experiences →':'Next: My Cart →';return needVenue}\nel('nextBtn').onclick=()=>{persist();if(nextState()){ddGo('/approved-pages/Dear-Day-Venues-Approved-en.html',plan);return}ddGo('/approved-pages/Dear-Day-Cart.html',plan)};"
          new="function nextState(){const services=plan.services||[];const packageMode=services.some(s=>/باقة متكاملة|full package|complete package|package/i.test(s));const needFlowers=packageMode||services.some(s=>/flowers?|ورد|زهور/i.test(s));const needVenue=packageMode||services.some(s=>/أماكن|تجارب|places|venues|experiences/i.test(s));el('nextBtn').textContent=needFlowers?'Next: Flowers →':needVenue?'Next: Places & Experiences →':'Next: My Cart →';return {needFlowers,needVenue}}\nel('nextBtn').onclick=()=>{persist();const {needFlowers,needVenue}=nextState();if(needFlowers){ddGo('/approved-pages/Dear-Day-Flowers-Approved-en.html',plan);return}if(needVenue){ddGo('/approved-pages/Dear-Day-Venues-Approved-en.html',plan);return}ddGo('/approved-pages/Dear-Day-Cart-en.html',plan)};"
          if old not in s: raise SystemExit('English cake routing block missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Flowers live catalog: add a planning-flow continuation bar.
          p=Path('approved-pages/dear-day-live-catalog.js')
          s=p.read_text(encoding='utf-8')
          anchor="  function mount(){\n"
          helper="""  function flowPlan(){try{const q=new URLSearchParams(location.search).get('dd');if(q)return JSON.parse(q)}catch(e){}try{return JSON.parse(localStorage.getItem('dearDayPlan')||'{}')}catch(e){return {}}}\n  function flowActive(){const p=new URLSearchParams(location.search);return p.get('flow')==='1'||!!p.get('dd')}\n  function flowGo(file,plan){try{localStorage.setItem('dearDayPlan',JSON.stringify(plan||{}))}catch(e){}const q=new URLSearchParams();q.set('flow','1');q.set('dd',JSON.stringify(plan||{}));location.href=file+'?'+q.toString()}\n  function flowerCartCount(){try{const a=JSON.parse(localStorage.getItem('dearDayCart')||'[]');return Array.isArray(a)?a.filter(x=>x&&x.type==='flower').length:0}catch(e){return 0}}\n  function mountFlowerFlow(){if(section!=='flowers'||!flowActive()||document.getElementById('ddFlowerFlowBar'))return;const plan=flowPlan(),services=Array.isArray(plan.services)?plan.services:[],packageMode=services.some(s=>/باقة متكاملة|full package|complete package|package/i.test(String(s)));const needVenue=packageMode||services.some(s=>/أماكن|تجارب|places|venue|experience/i.test(String(s)));const bar=document.createElement('div');bar.id='ddFlowerFlowBar';bar.innerHTML=`<span>${T('اختار الورد المناسب ثم كمل خطتك','Choose your flowers, then continue your plan')}</span><button type=\"button\">${needVenue?T('التالي: الأماكن والتجارب ←','Next: Places & Experiences →'):T('التالي: My Cart ←','Next: My Cart →')}</button>`;document.body.appendChild(bar);bar.querySelector('button').onclick=()=>{if(!flowerCartCount()){const msg=T('اختار منتج ورد واحد على الأقل علشان نكمل','Add at least one flower item to continue');const old=bar.querySelector('span').textContent;bar.querySelector('span').textContent=msg;setTimeout(()=>bar.querySelector('span').textContent=old,1800);return}if(needVenue){flowGo(EN?'/approved-pages/Dear-Day-Venues-Approved-en.html':'/approved-pages/Dear-Day-Venues-Approved.html',plan);return}flowGo(EN?'/approved-pages/Dear-Day-Cart-en.html':'/approved-pages/Dear-Day-Cart.html',plan)}}\n\n"""
          if 'function mountFlowerFlow()' not in s:
              if anchor not in s: raise SystemExit('live catalog mount anchor missing')
              s=s.replace(anchor,helper+anchor,1)
          s=s.replace("    bind();apply();\n  }", "    bind();apply();mountFlowerFlow();\n  }",1)
          s=s.replace("@media(max-width:600px){", "#ddFlowerFlowBar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:2147482500;width:min(1120px,calc(100% - 34px));background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border:1px solid rgba(107,53,64,.14);border-radius:22px;box-shadow:0 18px 55px rgba(76,31,36,.18);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:#6B3540;font-weight:700;font-size:12px}#ddFlowerFlowBar button{border:0;background:#6B3540;color:#fff;border-radius:999px;padding:12px 22px;font-weight:800;cursor:pointer}@media(max-width:600px){#ddFlowerFlowBar{bottom:8px;flex-direction:column;align-items:stretch;text-align:center}#ddFlowerFlowBar button{width:100%}",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add approved-pages/Dear-Day-Birthday-Approved.html approved-pages/Dear-Day-Birthday-Approved-en.html approved-pages/Dear-Day-Gifts-Approved.html approved-pages/Dear-Day-Gifts-Approved-en.html approved-pages/Dear-Day-Cake-Approved.html approved-pages/Dear-Day-Cake-Approved-en.html approved-pages/dear-day-live-catalog.js
          git commit -m "Add flowers to occasion planning flow"
          git push
