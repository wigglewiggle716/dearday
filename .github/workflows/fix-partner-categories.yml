name: Fix partner categories
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-partner-categories.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply partner form cleanup
        run: |
          echo '' | base64 -d | python3
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add approved-pages/Dear-Day-Partners.html
          git commit -m 'Simplify partner activity categories'
          git push
