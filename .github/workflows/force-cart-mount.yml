name: Force Cart Mount
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-cart-mount.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mount cart before other boot logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('approved-pages/dear-day-cart.js')
          s=p.read_text(encoding='utf-8')
          old="""  function boot(){
    normalizeGlobalHeader();
    bindMobileDatePickers();
    normalizePaymentLogos();
    initSignatureExperience();
    importPlan(readPlanData());
    removeHeaderCart();
    paint();"""
          new="""  function boot(){
    const floating=ensureFloatingCart();
    floating.classList.add('dd-cart-visible');
    floating.setAttribute('aria-hidden','false');
    floating.tabIndex=0;
    const earlyCount=floating.querySelector('.dd-float-count');
    if(earlyCount){
      const n=count();
      earlyCount.textContent=n;
      earlyCount.style.display=n>0?'grid':'none';
    }
    try{normalizeGlobalHeader()}catch(e){console.error('Dear Day header init:',e)}
    try{bindMobileDatePickers()}catch(e){console.error('Dear Day date init:',e)}
    try{normalizePaymentLogos()}catch(e){console.error('Dear Day payment init:',e)}
    try{initSignatureExperience()}catch(e){console.error('Dear Day signature init:',e)}
    try{importPlan(readPlanData())}catch(e){console.error('Dear Day cart sync:',e)}
    removeHeaderCart();
    paint();"""
          if old not in s:
              raise SystemExit('boot marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add approved-pages/dear-day-cart.js
          git commit -m "Mount floating cart before page boot logic" || exit 0
          git push
# trigger
