name: Autogrow partner textareas
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autogrow-partner-textareas.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update partner textareas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('approved-pages/Dear-Day-Partners.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.field textarea{min-height:112px;resize:vertical}', '.field textarea{min-height:112px;resize:none;overflow:hidden}', 1)
          marker="(function(){\n  const form=document.getElementById('partnerApplication');"
          inject="(function(){\n  document.querySelectorAll('#partnerApplication textarea').forEach(function(textarea){\n    const autoGrow=function(){textarea.style.height='auto';textarea.style.height=textarea.scrollHeight+'px';};\n    textarea.addEventListener('input',autoGrow);\n    autoGrow();\n  });\n  const form=document.getElementById('partnerApplication');"
          if marker not in s:
              raise SystemExit('partner script marker not found')
          s=s.replace(marker, inject, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add approved-pages/Dear-Day-Partners.html
          git commit -m 'Make partner textareas auto grow'
          git push
