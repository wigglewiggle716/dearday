name: Match cake price filter to venues
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/match-cake-price-filter.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update cake price filter
        run: |
          python - <<'PY'
          from pathlib import Path

          files=[
            ('cake.html','ar'),
            ('approved-pages/Dear-Day-Cake-Approved.html','ar'),
            ('cake-en.html','en'),
            ('approved-pages/Dear-Day-Cake-Approved-en.html','en'),
          ]
          for path,lang in files:
              p=Path(path)
              s=p.read_text(encoding='utf-8')

              if lang=='ar':
                  old='<div class="filter-group"><h4>أقصى سعر</h4><input id="priceRange" max="2000" min="500" step="50" type="range" value="2000"/><div class="range-row"><span>EGP 500</span><strong id="maxPrice">EGP 2,000</strong></div></div>'
                  new='<div class="filter-group"><h4>السعر</h4><div class="chips" data-filter="budget"><button class="chip active" data-value="all">الكل</button><button class="chip" data-value="low">أقل من 1,000</button><button class="chip" data-value="mid">1,000–2,500</button><button class="chip" data-value="high">أكثر من 2,500</button></div></div>'
                  if old not in s:
                      raise SystemExit('AR price markup missing in '+path)
                  s=s.replace(old,new,1)
              else:
                  old='<div class="filter-group"><h4>Maximum price</h4><input id="priceRange" max="2000" min="500" step="50" type="range" value="2000"><div class="range-row"><span>EGP 500</span><strong id="maxPrice">EGP 2,000</strong></div></div>'
                  new='<div class="filter-group"><h4>Price</h4><div class="chips" data-filter="budget"><button class="chip active" data-value="all">All</button><button class="chip" data-value="low">Under 1,000</button><button class="chip" data-value="mid">1,000–2,500</button><button class="chip" data-value="high">Over 2,500</button></div></div>'
                  if old not in s:
                      raise SystemExit('EN price markup missing in '+path)
                  s=s.replace(old,new,1)

              s=s.replace("const filters={category:'all',people:'all',flavor:'all',design:'all',max:2000,q:''};",
                          "const filters={category:'all',people:'all',flavor:'all',design:'all',budget:'all',q:''};")

              old_pass="if(filters.design!=='all'&&p.design!==filters.design)return false;if(p.price>filters.max)return false;"
              new_pass="if(filters.design!=='all'&&p.design!==filters.design)return false;if(filters.budget==='low'&&p.price>=1000)return false;if(filters.budget==='mid'&&(p.price<1000||p.price>2500))return false;if(filters.budget==='high'&&p.price<=2500)return false;"
              if old_pass not in s:
                  raise SystemExit('pass price logic missing in '+path)
              s=s.replace(old_pass,new_pass,1)

              old_sync="function syncAll(){document.querySelectorAll('.chips').forEach(g=>g.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.value===filters[g.dataset.filter])));document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.value===filters.category));el('priceRange').value=filters.max;el('maxPrice').textContent='EGP '+money(filters.max)}"
              new_sync="function syncAll(){document.querySelectorAll('.chips').forEach(g=>g.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.value===filters[g.dataset.filter])));document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.value===filters.category))}"
              if old_sync not in s:
                  raise SystemExit('syncAll old range logic missing in '+path)
              s=s.replace(old_sync,new_sync,1)

              import re
              before=s
              s=re.sub(r"el\('priceRange'\)\.oninput=e=>\{filters\.max=\+e\.target\.value;el\('maxPrice'\)\.textContent='EGP '\+money\(filters\.max\);renderGrid\(\)\};?","",s,count=1)
              s=s.replace("filters.category=filters.people=filters.flavor=filters.design='all';filters.max=2000;filters.q='';","filters.category=filters.people=filters.flavor=filters.design=filters.budget='all';filters.q='';",1)
              if s==before:
                  raise SystemExit('old price handlers missing in '+path)

              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in ['cake.html','approved-pages/Dear-Day-Cake-Approved.html','cake-en.html','approved-pages/Dear-Day-Cake-Approved-en.html']:
              s=Path(p).read_text(encoding='utf-8')
              assert 'data-filter="budget"' in s
              assert 'priceRange' not in s
              assert 'maxPrice' not in s
              assert "filters.budget==='low'" in s
              assert "filters.budget==='mid'" in s
              assert "filters.budget==='high'" in s
          print('Cake price chips verified')
          PY
      - name: Commit
        run: |
          git config user.name 'Dear Day Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add cake.html cake-en.html approved-pages/Dear-Day-Cake-Approved.html approved-pages/Dear-Day-Cake-Approved-en.html
          git commit -m 'Match Chocolate and Cakes price filter to venues'
          git push origin main
