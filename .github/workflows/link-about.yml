name: Link About footer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-about.yml'

permissions:
  contents: write

jobs:
  link-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link About Us in all HTML footers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = '/approved-pages/Dear-Day-About.html'
          pattern = re.compile(r'<a\b([^>]*?)href=(["\'])#\2([^>]*)>\s*من نحن\s*</a>', re.I)

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              def repl(m):
                  q = m.group(2)
                  return f'<a{m.group(1)}href={q}{target}{q}{m.group(3)}>من نحن</a>'
              new = pattern.sub(repl, text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', *changed, sep='\n- ')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/link-about.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Link About Us footer across site"
          git push
