name: Brand birthday date control
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/birthday-date-branding.yml'
permissions:
  contents: write
jobs:
  brand-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply branded date control
        env:
          DD_DATE_STYLE_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, base64
          files = [Path('birthday.html'), Path('approved-pages/Dear-Day-Birthday-Approved.html')]
          marker = 'id="dd-birthday-date-branding"'
          block = base64.b64decode(os.environ['DD_DATE_STYLE_B64']).decode('utf-8')
          for path in files:
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  print('already branded', path)
                  continue
              if '</head>' not in text:
                  raise SystemExit(f'{path}: missing </head>')
              path.write_text(text.replace('</head>', block + '\n</head>', 1), encoding='utf-8')
              print('updated', path)
          PY
      - name: Verify branding
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in ['birthday.html','approved-pages/Dear-Day-Birthday-Approved.html']:
              s=Path(p).read_text(encoding='utf-8')
              assert 'id="dd-birthday-date-branding"' in s
              assert '#ddContextDate::-webkit-calendar-picker-indicator' in s
              print('verified', p)
          PY
      - name: Commit branded date
        run: |
          git config user.name 'Dear Day Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add birthday.html approved-pages/Dear-Day-Birthday-Approved.html
          git diff --cached --quiet && exit 0
          git commit -m 'Brand birthday date control'
          git push origin main
