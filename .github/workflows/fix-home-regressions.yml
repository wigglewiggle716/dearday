name: Fix home regressions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-regressions.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Preserve guest Login/Create Account after auth-state resolves.
          p = Path('approved-pages/dear-day-auth-state.js')
          s = p.read_text()
          old = "function mountAccountMenu(user,signOut){const header=document.querySelector('header');if(!header)return;const actions=header.querySelector('.dd-global-actions,.auth-actions,.header-actions,.actions');if(!actions)return;actions.querySelectorAll('a.dd-auth,a.header-auth,.dd-user-chip,.dd-logout').forEach(el=>el.remove());let wrap=actions.querySelector('.dd-account-wrap');if(!user){wrap?.remove();return}"
          new = "function mountAccountMenu(user,signOut){const header=document.querySelector('header');if(!header)return;const actions=header.querySelector('.dd-global-actions,.auth-actions,.header-actions,.actions');if(!actions)return;let wrap=actions.querySelector('.dd-account-wrap');if(!user){wrap?.remove();actions.querySelectorAll('.dd-user-chip,.dd-logout').forEach(el=>el.remove());return}actions.querySelectorAll('a.dd-auth,a.header-auth,.dd-user-chip,.dd-logout').forEach(el=>el.remove());"
          if old not in s:
              raise SystemExit('auth-state target not found')
          p.write_text(s.replace(old,new,1))

          # 2) Keep carousel scrolling horizontal only and correct physical arrow glyphs.
          p = Path('approved-pages/dear-day-home-categories.js')
          s = p.read_text()
          s = s.replace("${en?'‹':'›'}</button><div class=\"dd-curated-track\"", "‹</button><div class=\"dd-curated-track\"", 1)
          s = s.replace("${en?'›':'‹'}</button></div></div>`;", "›</button></div></div>`;", 1)
          old_scroll = "function scrollToIndex(smooth=true){const track=document.getElementById('ddCuratedTrack'),cards=track?.querySelectorAll('.dd-pick-card');if(!track||!cards?.length)return;const idx=Math.min(state.index[state.tab]||0,cards.length-1);cards[idx]?.scrollIntoView({behavior:smooth?'smooth':'auto',block:'nearest',inline:'start'});updateArrows()}"
          new_scroll = "function scrollToIndex(smooth=true){const track=document.getElementById('ddCuratedTrack'),cards=track?.querySelectorAll('.dd-pick-card');if(!track||!cards?.length)return;const idx=Math.min(state.index[state.tab]||0,cards.length-1);const step=cards.length>1?Math.abs(cards[1].offsetLeft-cards[0].offsetLeft):(cards[0].getBoundingClientRect().width+14);const left=(en?1:-1)*idx*step;track.scrollTo({left,behavior:smooth?'smooth':'auto'});updateArrows()}"
          if old_scroll not in s:
              raise SystemExit('carousel scroll target not found')
          p.write_text(s.replace(old_scroll,new_scroll,1))

          # 3) Cache bust both patched runtime files.
          p = Path('approved-pages/dear-day-mobile-nav.js')
          s = p.read_text().replace('/approved-pages/dear-day-auth-state.js?v=20261002-2','/approved-pages/dear-day-auth-state.js?v=20261003-4')
          p.write_text(s)

          p = Path('approved-pages/dear-day-cart.js')
          s = p.read_text().replace('/approved-pages/dear-day-mobile-nav.js?v=20261003-3','/approved-pages/dear-day-mobile-nav.js?v=20261003-4').replace('/approved-pages/dear-day-home-categories.js?v=20261003-3','/approved-pages/dear-day-home-categories.js?v=20261003-4')
          p.write_text(s)
          PY
          git rm .github/workflows/fix-home-regressions.yml
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix home auth, carousel scroll and arrow direction'
          git push
