name: Run legal footer normalizer
on: [push]
permissions:
  contents: write
jobs:
  run:
    if: github.event.head_commit.message == 'Add legal footer normalizer runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/normalize_legal_footers.py
      - run: node --check approved-pages/dear-day-cart.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'Normalize legal page footers' || exit 0
          git push
