name: Run mobile footer accordion patch

on:
  push:
    paths:
      - '.github/workflows/run-mobile-footer-accordion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile footer accordion
        run: |
          python scripts/add_mobile_footer_accordion.py
          node --check approved-pages/dear-day-cart.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add mobile footer accordions"
            git push origin HEAD:main
          fi
