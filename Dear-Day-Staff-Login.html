<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#6B3540">
<title>دخول فريق Dear Day</title>
<style>
@font-face{font-family:'Noto Sans Arabic';font-style:normal;font-weight:400;font-display:swap;src:url('/approved-pages/assets/fonts/noto-sans-arabic-400.woff2') format('woff2')}@font-face{font-family:'Noto Sans Arabic';font-style:normal;font-weight:700;font-display:swap;src:url('/approved-pages/assets/fonts/noto-sans-arabic-700.woff2') format('woff2')}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAF3EA;color:#352D2E;font-family:'Noto Sans Arabic',Tahoma,Arial,sans-serif;padding:20px}.card{width:min(460px,100%);background:#fffdfc;border:1px solid rgba(107,53,64,.16);border-radius:28px;padding:34px;box-shadow:0 24px 70px rgba(75,39,43,.1)}.logo{display:block;width:190px;max-height:75px;object-fit:contain;margin:0 auto 12px;mix-blend-mode:multiply}h1{text-align:center;color:#6B3540;margin:0 0 5px;font-size:28px}p{text-align:center;color:#786C69;font-size:12px;margin:0 0 24px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;font-weight:700}.field input{height:50px;border:1px solid #e5d8d3;border-radius:14px;padding:0 13px;font:inherit}.btn{width:100%;height:50px;border:0;border-radius:14px;background:#6B3540;color:#fff;font:700 13px inherit;cursor:pointer;margin-top:10px}.status{min-height:22px;text-align:center;color:#A8583D;font-size:11px;margin-top:10px}.back{display:block;text-align:center;margin-top:16px;color:#6B3540;font-size:11px;text-decoration:none}
</style>
</head>
<body>
<main class="card"><img class="logo" src="/approved-pages/assets/dear-day-wordmark.svg" alt="Dear Day"><h1>دخول فريق Dear Day</h1><p>لوحة الإدارة والعمليات والحسابات.</p><form id="form"><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><button id="submit" class="btn" type="submit">تسجيل الدخول</button><div id="status" class="status"></div></form><a class="back" href="/">العودة إلى Dear Day</a></main>
<script src="/approved-pages/dear-day-supabase-config.js?v=20261002-1"></script>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';
import{guardMfa}from'/approved-pages/dear-day-mfa.js';
const c=window.DEAR_DAY_SUPABASE,s=createClient(c.url,c.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id);
const routes={super_admin:'/Dear-Day-Admin.html',admin:'/Dear-Day-Admin.html',operations:'/Dear-Day-Admin-Orders.html',accountant:'/Dear-Day-Finance.html',partner_manager:'/Dear-Day-Admin-Partners.html',customer_support:'/Dear-Day-Admin-Orders.html',marketing:'/Dear-Day-Staff.html',content_admin:'/Dear-Day-Admin-Products.html'};
async function routeUser(u){const{data:p,error}=await s.from('profiles').select('role,is_active').eq('id',u.id).single();if(error||!p||!p.is_active||!routes[p.role]){await s.auth.signOut();$('status').textContent='هذا الحساب غير مصرح له بدخول بوابة الفريق.';return false}if(!await guardMfa(s,p.role,routes[p.role]))return false;location.replace(routes[p.role]);return true}
const{data:{user}}=await s.auth.getUser();if(user)routeUser(user);
$('form').addEventListener('submit',async e=>{e.preventDefault();$('status').textContent='جاري تسجيل الدخول…';$('submit').disabled=true;const{data,error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('status').textContent='بيانات الدخول غير صحيحة أو الحساب غير متاح.';$('submit').disabled=false;return}await routeUser(data.user);$('submit').disabled=false});
</script></body></html>
