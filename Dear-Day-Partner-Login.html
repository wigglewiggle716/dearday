<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#6B3540"><title>دخول الشركاء | Dear Day</title><link rel="stylesheet" href="/approved-pages/dear-day-partner.css?v=20261002-1"></head><body><main class="login-shell"><section class="login-card"><img src="/approved-pages/assets/dear-day-wordmark.svg" alt="Dear Day"><h1>بوابة الشركاء</h1><p>سجّل الدخول لإدارة طلباتك ومنتجاتك وخدماتك على Dear Day.</p><div id="errorBox" class="error"></div><form id="loginForm"><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required placeholder="partner@example.com"></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required minlength="6"></div><button id="loginBtn" class="btn" type="submit">تسجيل الدخول</button></form><p class="login-note">هذه الصفحة مخصصة لشركاء Dear Day المعتمدين فقط.</p><p><a href="/" style="color:#6B3540;font-weight:700">العودة للموقع</a></p></section></main><script src="/approved-pages/dear-day-partner-common.js?v=20261002-1"></script><script>(async function(){const D=window.DDPartner,supabase=await D.client();const {data:{user}}=await supabase.auth.getUser();if(user){const {data:p}=await supabase.from('profiles').select('role,is_active').eq('id',user.id).maybeSingle();if(p?.is_active&&p.role==='partner_user'){location.replace('/Dear-Day-Partner.html');return}}document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('loginBtn');btn.disabled=true;D.show('errorBox','');try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;const {data:p,error:pErr}=await supabase.from('profiles').select('role,is_active').eq('id',data.user.id).single();if(pErr||!p?.is_active||p.role!=='partner_user'){await supabase.auth.signOut();throw new Error('هذا الحساب غير مخصص لبوابة الشركاء.')}location.replace('/Dear-Day-Partner.html')}catch(err){D.show('errorBox',err.message||'تعذر تسجيل الدخول.');btn.disabled=false}})})();</script></body></html>
