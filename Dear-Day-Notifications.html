<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>الإشعارات | Dear Day</title><style>@font-face{font-family:'Noto Sans Arabic';font-style:normal;font-weight:400;font-display:swap;src:url('/approved-pages/assets/fonts/noto-sans-arabic-400.woff2') format('woff2')}@font-face{font-family:'Noto Sans Arabic';font-style:normal;font-weight:700;font-display:swap;src:url('/approved-pages/assets/fonts/noto-sans-arabic-700.woff2') format('woff2')}:root{--wine:#6B3540;--ivory:#FAF3EA;--paper:#FFFDFC;--muted:#786C69;--line:rgba(107,53,64,.15);--terra:#A8583D}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:#352D2E;font-family:'Noto Sans Arabic',Tahoma,Arial,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:48px 0 80px}.head{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.head h1{margin:0;color:var(--wine);font-size:32px}.head p{margin:5px 0 0;color:var(--muted)}button,.back{border:1px solid var(--wine);background:#fff;color:var(--wine);border-radius:999px;padding:10px 15px;font:700 12px inherit;cursor:pointer;text-decoration:none}.actions{display:flex;gap:8px}.list{display:grid;gap:12px}.notice{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 34px rgba(78,32,39,.05);cursor:pointer}.notice.unread{border-color:rgba(168,88,61,.45);box-shadow:0 12px 34px rgba(168,88,61,.09)}.notice-top{display:flex;justify-content:space-between;gap:14px}.notice h2{font-size:16px;color:var(--wine);margin:0 0 6px}.notice p{margin:0;color:#5f5452;font-size:13px;line-height:1.8}.notice time{color:var(--muted);font-size:10px;white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--terra);margin-left:6px}.empty{background:#fff;border:1px solid var(--line);border-radius:22px;padding:38px;text-align:center;color:var(--muted)}.status{margin:0 0 14px;color:var(--muted);font-size:12px}.error{color:#9a4545}.count{display:inline-grid;place-items:center;min-width:23px;height:23px;padding:0 7px;border-radius:999px;background:var(--wine);color:#fff;font-size:11px;margin-right:6px}@media(max-width:650px){.wrap{padding-top:30px}.head{display:block}.actions{margin-top:14px}.notice-top{display:block}.notice time{display:block;margin-top:8px}}</style></head><body><main class="wrap"><div class="head"><div><h1>الإشعارات <span id="unreadCount" class="count" hidden>0</span></h1><p>آخر التحديثات الخاصة بطلباتك وتشغيل Dear Day.</p></div><div class="actions"><a id="backLink" class="back" href="/">رجوع</a><button id="markAll" type="button">تحديد الكل كمقروء</button></div></div><p id="status" class="status">جاري تحميل الإشعارات…</p><div id="notificationsList" class="list"></div></main><script src="/approved-pages/dear-day-notifications.js?v=20261003-2"></script></body></html>
