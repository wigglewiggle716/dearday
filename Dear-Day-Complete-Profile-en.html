<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF3EA">
<title>Complete your profile | Dear Day</title>
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#FAF3EA;--paper:#FFFDFC;--wine:#6B3540;--terra:#A8583D;--ink:#352D2E;--muted:#756A68;--line:rgba(107,53,64,.17);--shadow:0 24px 70px rgba(78,32,39,.12)}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Arial,sans-serif;min-height:100svh}.page{min-height:100svh;display:grid;place-items:center;padding:38px 18px}.card{width:min(620px,100%);background:rgba(255,253,252,.94);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:34px}.logo{display:block;width:180px;margin:0 auto 12px}.eyebrow{text-align:center;color:var(--terra);font-size:12px;font-weight:700;margin:0 0 4px}.card h1{text-align:center;color:var(--wine);font:600 30px/1.3 Lora,Georgia,serif;margin:0 0 8px}.intro{text-align:center;color:var(--muted);font-size:13px;max-width:450px;margin:0 auto 28px;line-height:1.65}.form{display:grid;gap:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:700;color:#574A47}.req{color:var(--terra)}input{width:100%;height:50px;border:1px solid #E4D7D2;border-radius:14px;background:#fff;padding:0 14px;color:var(--ink);font:inherit;outline:none}input:focus{border-color:var(--terra);box-shadow:0 0 0 4px rgba(168,88,61,.08)}input[readonly]{background:#F7F1ED;color:#766B68}.hint{font-size:10px;color:#968985}.primary{width:100%;min-height:52px;border:0;border-radius:15px;background:var(--wine);color:#fff;font:700 14px Arial,sans-serif;cursor:pointer;margin-top:4px}.primary:disabled{opacity:.65;cursor:wait}.status{min-height:18px;margin:0;text-align:center;font-size:12px}.optional{font-size:10px;color:#998A86;font-weight:400}@media(max-width:620px){.card{padding:28px 20px;border-radius:23px}.card h1{font-size:26px}.two{grid-template-columns:1fr}.logo{width:160px}}
</style>
</head>
<body>
<main class="page">
<section class="card" aria-labelledby="profileTitle">
<img class="logo" src="/approved-pages/assets/dear-day-wordmark.svg" alt="Dear Day">
<p class="eyebrow">One last step</p>
<h1 id="profileTitle">Complete your profile</h1>
<p class="intro">Add the essentials so we can set up your account properly. The optional details can be changed later.</p>
<form class="form" id="completeProfileForm" novalidate>
<div class="two">
<div class="field"><label for="profileFirstName">First name <span class="req">*</span></label><input id="profileFirstName" autocomplete="given-name" required></div>
<div class="field"><label for="profileLastName">Last name <span class="req">*</span></label><input id="profileLastName" autocomplete="family-name" required></div>
</div>
<div class="field"><label for="profileEmail">Email <span class="req">*</span></label><input id="profileEmail" type="email" autocomplete="email" readonly required><span class="hint">Filled automatically from your sign-in method.</span></div>
<div class="field"><label for="profilePhone">Mobile number <span class="req">*</span></label><input id="profilePhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx" required></div>
<div class="two">
<div class="field"><label for="profileBirthDate">Date of birth <span class="optional">Optional</span></label><input id="profileBirthDate" type="date" autocomplete="bday"></div>
<div class="field"><label for="profileArea">Area <span class="optional">Optional</span></label><input id="profileArea" autocomplete="address-level2" placeholder="e.g. Haram, Maadi, Sheikh Zayed"></div>
</div>
<button class="primary" type="submit">Save & continue</button>
<p class="status" id="profileStatus" role="status" aria-live="polite"></p>
</form>
</section>
</main>
<script src="/approved-pages/dear-day-complete-profile.js?v=20261003-6"></script>
</body>
</html>
